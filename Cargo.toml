[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.86"
license = "MIT"
authors = ["Lorenzo Matheus Rodrigues <lorenzo@gestao.com.br>"]
description = "Local-first LLM observability for macOS — track usage across Anthropic, OpenAI, Z.AI, and OpenRouter with AI-powered insights"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
