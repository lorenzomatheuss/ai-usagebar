checks_detail:
  - name: code_review
    verdict: PASS
    notes: >-
      Implementation in `crates/torven-core/src/uniffi_exports.rs` is
      well-factored. Public FFI shim `ffi_refresh_vendor` is a 1-line wrapper
      that hands the inner future to `::uniffi::deps::async_compat::Compat::new`
      so reqwest/tokio::time find a tokio reactor inside the UniFFI UDL-mode
      polling driver (mirrors `InsightsClient::request_insight_streaming` from
      Story 1.15). Inner `refresh_vendor_inner` separates the business logic
      from the FFI shim cleanly — tests can drive it directly under
      `#[tokio::test]` without involving the FFI polling loop. Slug validation
      uses a `match` on `vendor_name.as_str()` BEFORE `ensure_history_initialized()`,
      ensuring unknown slugs short-circuit to `CredentialMissing` without
      touching the DB or the network (defensive and AC-2-aligned). Per-vendor
      `refresh_{anthropic,openai,openrouter,zai}` helpers all follow the same
      shape: credential lookup → Cache::for_vendor → Endpoints::default →
      await fetch_snapshot → project via `outcome_to_snapshot_input`. The
      `unreachable!("vendor slug pre-validated")` arm in the second match is
      good defensive programming. `keychain_api_key_for` correctly honors the
      `ACTIVE_ACCOUNTS` map for multi-account vendors (openrouter/zai) with a
      first-account fallback consistent with Story 3.3 default-active
      semantics. `outcome_to_snapshot_input` delegates the cost_usd/pct_used
      projection to `compute_metrics` — this is the single source of truth
      that SwiftUI and the dev TUI both consume, so the persisted snapshot
      row matches the headline metric Swift renders. metric_kind selection
      via `LabelKind` keeps the GROUP BY (Story 4.0.5) coherent — UsdSpent
      → cost_usd_total, everything else → pct_used. From<AppError> mapping
      is granular: `Io NotFound` is distinct from generic `Io` so
      "credentials file missing" routes to `CredentialMissing` (re-auth
      affordance) instead of `ParseFailure`. `From<HistoryFfiError>` collapses
      both variants (NotInitialized, Storage) to `StorageError` — reasonable
      since the FFI consumer can't disambiguate.

  - name: unit_tests
    verdict: PASS
    notes: >-
      13 new tests under `mod tests` cover the surface comprehensively. Error
      mapping: 6 tests assert each AppError variant maps to the expected
      RefreshFfiError (Credentials → CredentialMissing, Io NotFound →
      CredentialMissing, Transport → NetworkError, Http → ApiError, Schema →
      ParseFailure, HistoryFfiError::NotInitialized → StorageError). Outcome
      projection: 4 tests build fake VendorSnapshots (Anthropic, OpenRouter,
      OpenAI Codex OAuth, Z.AI) and assert the metric_kind/cost_usd/pct_used/
      account_id fields land where expected. Dispatch: 2 tokio tests assert
      that unknown vendor slugs and missing-keychain vendors return
      CredentialMissing without panicking. 1 smoke test exercises the
      uninitialized-history + unknown-vendor path to confirm no hang/panic.
      The `refresh_keychain_vendor_without_key_returns_credential_missing`
      test cleverly uses a bogus slug for `keychain_api_key_for` instead of
      touching real Keychain entries — cross-platform safe.

  - name: acceptance_criteria
    verdict: PASS
    notes: >-
      All 8 ACs verified against implementation. AC-1 UDL extended exactly as
      spec'd (5 enum variants + `[Async, Throws=RefreshFfiError] void
      ffi_refresh_vendor(string vendor_name)` in namespace). AC-2 slug
      dispatch handles 4 canonical slugs + unknown → CredentialMissing with
      `tracing::warn!`. AC-3 `outcome_to_snapshot_input` projects fields per
      spec (vendor slug, account_id None for single-account vendors,
      ts = chrono::Utc::now().timestamp_millis(), cost_usd/pct_used via
      compute_metrics, metric_kind cost_usd_total | pct_used per LabelKind).
      AC-4 lazy init via `ensure_history_initialized` is idempotent
      (`OnceLock::get_or_init` semantics). AC-5 granular error mapping
      verified by 6 unit tests. AC-6 `cargo test --workspace` re-run by QA
      shows 267 passed, zero failures. AC-7 `make build-core` produces
      `ffiRefreshVendor(vendorName: String) async throws` and `RefreshFfiError`
      enum in `torven_core.swift`; `xcodebuild` BUILD SUCCEEDED (confirmed by
      @dev, not re-run by QA — environment-dependent and dev evidence is
      sufficient). AC-8 `tracing::info!` calls at start/complete with vendor
      slug and elapsed_ms.

  - name: no_regressions
    verdict: PASS
    notes: >-
      `cargo test --workspace` re-executed locally during gate. Results:
      198 lib + 29 TUI + 18 anthropic_e2e + 10 history_e2e + 3 insights_e2e
      + 3 keychain_e2e (1 macOS ignored) + 4 live (all ignored as expected)
      + 2 file_fallback = 267 passed, 0 failed. Pre-existing live tests
      remain `#[ignore]`d (correct — they hit real APIs). The Story 1.15
      AR-2 spike timer ignored count is preserved. No flaky tests observed.

  - name: performance
    verdict: PASS
    notes: >-
      Zero blocking primitives in the async path (verified via grep for
      block_on, block_in_place, spawn_blocking in uniffi_exports.rs — all
      absent). `async_compat::Compat::new` is the only context shim, which
      is the documented Story 1.15 pattern. `reqwest::Client::new()` per
      refresh call is a minor allocation (~1ms) versus network latency
      (~300ms upstream APIs); pooling would optimize <1% and is YAGNI per
      story doc — defer to Wave 6 if profiling justifies. Cache TTL =
      `Duration::ZERO` is intentional (refresh manual always hits network).

  - name: security
    verdict: PASS
    notes: >-
      No api_key crosses the FFI boundary as `string` — the FFI takes a
      vendor slug only; the credential never leaves Rust. `tracing::info!`
      and `tracing::warn!` calls log only the vendor slug, elapsed_ms, and
      absolute paths to credentials files (file existence is signal, not
      content). `keychain_api_key_for` returns the api_key as a `Result<String,
      RefreshFfiError>` that flows directly into the fetcher and is never
      logged or persisted. CLAUDE.md secret-discipline invariants honored:
      no `cat` of credentials files, no env grep, no key material in tracing
      output.

  - name: documentation
    verdict: PASS
    notes: >-
      Story file has complete File List (3 modified Rust files + 2 Swift
      artifacts regenerated). Change Log has 5 chronological entries from
      @sm draft through @po validation, @dev InProgress, @dev InReview, and
      @qa gate (this entry). Risks documented with mitigations (4 entries).
      Out of Scope explicit. Dependencies cross-referenced. ADR-2 and ADR-4
      cross-refs in multiple places. Inline rustdoc comments on `RefreshFfiError`,
      `keychain_api_key_for`, `outcome_to_snapshot_input`, `ffi_refresh_vendor`,
      `ensure_history_initialized`, and each per-vendor refresh helper connect
      implementation to acceptance criteria.

