cross_story_decisions:
  - id: WAVE5-D7
    decision: >-
      OpenAI in Story 5.2 mirrors Anthropic's OAuth-status read-only treatment
      (FileManager.fileExists on ~/.codex/auth.json), NOT a SecureField API
      key. Settings UI SecureField vendors reduce from 3 to 2 (openrouter, zai).
    rationale:
      - Wave 1 OpenAI fetcher takes creds_path:&Path; zero api_key branches in
        crates/torven-core/src/vendors/openai/.
      - CLAUDE.md classifies ~/.codex/auth.json as an OAuth credential file
        (same category as ~/.claude/.credentials.json).
      - Codex CLI is the canonical auth path; API key paste UX would bypass
        the OAuth refresh flow fetch_snapshot requires.
      - Option B (Keychain-first OpenAI with OAuth fallback) requires either
        reimplementing the fetcher (massive scope creep, breaks Story 1.4
        consolidation) or dual auth paths that contradict the vendor contract.
    resolves: CodeRabbit CRITICAL flagged during @dev uncommitted scan.
    action_taken:
      - Story 5.2 AC-1 updated to reflect 2 OAuth-status vendors + 2 SecureField vendors.
      - Story 5.2 AC-3 updated to scope onAppear key loading to openrouter/zai only.
      - Story 5.2 AC-4 updated to scope Save button to openrouter/zai only.
      - Story 5.2 AC-5 extended to cover OpenAI status check on ~/.codex/auth.json.
      - Story 5.2 T1/T2/T3 task descriptions aligned.
      - Story 5.2 DoD checklist updated.
      - WAVE5-D7 entry appended to Story 5.2 Change Log.

