status_reason: >-
  Wave 5 Story 5.1 opens the on-demand refresh path with a clean Rust-only
  implementation. `ffi_refresh_vendor` exposes a single async FFI surface that
  dispatches by vendor slug, reuses the Wave 1 fetchers verbatim (REUSE > ADAPT >
  CREATE per IDS Article IV-A), and persists via the existing
  `ffi_record_snapshot` path so retention/concurrency invariants are honored
  uniformly. All 8 ACs verified: AC-1 UDL extended with 5-variant
  `RefreshFfiError` enum and `[Async, Throws]` function declaration; AC-2 slug
  dispatch with early-return on unknown slug (no DB touch, no network);
  AC-3 `outcome_to_snapshot_input` reuses `compute_metrics` (single source of
  truth for VendorSnapshot → display/persistence projection, consistent with
  Story 4.0.5 GROUP BY semantics); AC-4 idempotent lazy init via `OnceLock` slot
  probe; AC-5 granular error mapping covering Credentials/Io-NotFound/Transport/
  Http/Schema/Json/HistoryFfi branches; AC-6 zero regressions
  (`cargo test --workspace` 267 passed end-to-end re-run by QA); AC-7
  `make build-core` + `xcodebuild` BUILD SUCCEEDED with
  `ffiRefreshVendor(vendorName: String) async throws` in Swift bindings;
  AC-8 `tracing::info!` start/complete with vendor slug + elapsed_ms (no
  credential exposure). `async_compat::Compat::new` pattern from Story 1.15
  reused exactly — zero `block_on`/`block_in_place`/`spawn_blocking` in the
  async path. Cross-story conflict (CodeRabbit CRITICAL) resolved at the gate
  via WAVE5-D7 (Option A): OpenAI in Story 5.2 mirrors Anthropic OAuth-status
  treatment, since the Wave 1 OpenAI fetcher takes `creds_path: &Path` and has
  zero `api_key` branches. Story 5.2 spec updated in parallel (AC-1/AC-3/AC-4/
  AC-5/T1-T3/DoD).

