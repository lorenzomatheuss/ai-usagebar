spec_deviations:
  - description: "AC-1 and AC-2 specify uniffi 0.27; implementation uses 0.29"
    rationale: "UniFFI 0.27 generates scaffolding with bare `#[no_mangle]` attributes. Rust edition 2024 (stabilized in 1.85, used by this workspace per workspace.package.edition='2024' / rust-version='1.86') requires the new `unsafe(no_mangle)` wrapper syntax. 0.27 builds fail compilation under edition 2024. UniFFI 0.28+ ships the fix; @dev selected 0.29 (current stable). Verified by inspecting workspace Cargo.toml (edition=2024, rust-version=1.86) and the fact that cargo build -p torven-core compiles cleanly only with 0.29."
    decision: accepted
    adr_alignment: "ADR-4 (UniFFI vs swift-bridge) unchanged. ADR-4 selects UniFFI as the binding tool family; it does not pin a specific minor version. 0.29 keeps the UDL-mode + tokio-async surface that ADR-4 relies on for Story 1.15 streaming. No swift-bridge fallback triggered."
    impact: "Future stories referencing `uniffi 0.27` in their AC text should be updated to read `uniffi 0.29+` during their *validate-story-draft pass. Recommendation logged for @po follow-up; not blocking."

