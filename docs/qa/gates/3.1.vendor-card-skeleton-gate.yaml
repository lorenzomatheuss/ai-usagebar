    lines 28-29 are Story 3.3 additions per its own AC-3).
  AC-2: >-
    PASS — Body (lines 31-56) contains the three mandated regions:
    (a) header HStack with `Text(vendor.displayName).font(.headline)`
    + `Image(systemName: vendor.isConfigured ? "checkmark.circle.fill"
    : "circle")` colored green/secondary; (b) metrics HStack with
    `Text("$— this period")` and `Text("—% used")` both at
