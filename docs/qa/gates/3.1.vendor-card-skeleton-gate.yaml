    `Rectangle().fill(Color.secondary.opacity(0.15)).frame(height: 24)`
    on lines 53-55.
  AC-3: >-
    PASS — Body matches the AC-3 canonical reference structurally
    (VStack(alignment: .leading, spacing: 6) → HStack header → HStack
    metrics → Rectangle placeholder → .padding(12) →
