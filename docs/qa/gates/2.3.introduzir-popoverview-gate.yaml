auto_decisions_accepted:
  - id: AD-2.3-frame-size-pre-uxq1
    decision: >-
      `.frame(width: 360, height: 420)` adopted as the Story 2.3 starting
      point instead of 380×540 (Wave 3 sizing for 5 cards).
    rationale: >-
      UX-Q1 (Wave 3) still open; Wave 2 does not need the final sizing
      decision; 360×420 is the PRD value and is sufficient for the empty
      popover skeleton. The change to 380×540 if Wave 3 decides so is
      a 1-line edit in `PopoverView.swift`.
    qa_verdict: ACCEPTED — defensible, documented in Dev Notes §2 with explicit reversibility.

  - id: AD-2.3-xcodebuild-project-explicit
    decision: >-
      xcodebuild called with `-project Torven.xcodeproj` explicit
      starting at Story 2.3 (Stories 2.1 and 2.2 used implicit resolution).
    rationale: >-
      `apple/` directory contains a stale untracked `apple/Torven
      2.xcodeproj/` (pre-Wave-1, dated May 31) that ambiguates implicit
      xcodebuild scheme resolution. Implicit resolution worked for 2.1
      and 2.2 by alphabetical luck; the explicit flag is defensive and
      future-proof.
    qa_verdict: ACCEPTED — defensive, documented in Change Log. See Recommendations for follow-up cleanup of the stale directory (out-of-scope for Story 2.3).

