status_reason: >-
  Story 2.3 closes Wave 2 SwiftUI Skeleton with a clean, well-documented
  refactor. `apple/Torven/Popover/PopoverView.swift` created with exactly
  the structure AC-1/AC-2 prescribe: `struct PopoverView: View`, body is
  a `VStack(spacing: 0)` containing a `Text("Torven").font(.title3).fontWeight(.semibold)`
  header with `.padding(.horizontal, 16).padding(.vertical, 12)`, a
  `Spacer()` below, and `.frame(width: 360, height: 420)` on the outer
  container (the PRD starting point — UX-Q1 may revise to 380×540 in
  Wave 3). `MenuBarContent.swift` refactored to delegate to `PopoverView()`
  (AC-3) — the last remaining link to the Story 1.5 stub is now severed
  on the happy path. `VendorListView_Story15.swift` continues to compile
  in the target as preservation per AC-4 (XcodeGen recursive discovery
  covers `Views/Preservation/`). `.gitkeep` placeholder removed from
  `Popover/` (T1). xcodebuild Debug BUILD SUCCEEDED on commit ab53e28
  with `-project Torven.xcodeproj` explicit (per AUTO-DECISION documented
  in the Change Log to defend against the stale untracked `apple/Torven
  2.xcodeproj/` ambiguity — see Recommendations). Smoke run successful
  on PID 76680: icon visible in status bar via MenuBarLabel, popover
  opens with header "Torven" + empty 360×420 area below (REGRESSION
  VISUAL EXPECTED per DoD bullet 6 — vendor cards return in Wave 3).
  Cargo workspace green (222 tests, clippy strict clean, fmt clean —
  AC-7). All 7 ACs verified. Two AUTO-DECISIONs (frame 360×420 as PRD
  starting point; `-project` explicit to dodge stale dir) are both
  defensible and honest.

