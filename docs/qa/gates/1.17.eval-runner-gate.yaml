status_reason: >-
  Wave 1 closes with the eval moat in place. `torven-evals` binary delivers the
  AC-3 Markdown report with all required metrics (faithfulness 0.90, relevance
  1.00, cost p50/p95 $0.0017) re-run live by QA against the 30-case dataset.
  Distribution verified exactly (10 trend / 8 anomaly / 7 budget_risk /
  5 optimization_opportunity; 15 info / 10 warning / 5 critical). 29/30 cases
  pass; the lone fail (eval-007 multi-vendor) is by-design per decision-log-1.17
  D-1 — the mock aggregates totals across vendors so the multi-vendor faithfulness
  drop is exactly the signal we want CI to detect once Story 1.21 wires the gate.
  `cargo test -p torven-core` 222 tests pass (160 lib + 3 anthropic_e2e + 18
  config + 4 history + 3 insights_e2e + 2 keychain + 29 tui + 3 ar2 spike
  ignored), `cargo clippy --all-targets -- -D warnings` clean, `cargo fmt
  --all --check` clean. Privacy invariant honoured — dataset uses only 8-hex
  account_id hashes, zero secret/api_key strings. All 9 ACs verified.

