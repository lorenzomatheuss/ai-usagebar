checks_detail:
  - name: code_review
    verdict: PASS
    notes: >-
      `src/bin/torven-evals.rs` is well-structured: clap derive API with proper
      `--dataset`/`--output`/`--real-llm` flags, defensive exit codes (2 on
      load/validate failures), `eprintln!` for diagnostic noise routed to
      stderr while the report goes to stdout/file, per-case error capture (no
      single-case failure aborts the run). The `MockLlmClient::for_eval`
      per-case rebuild on every iteration is a small allocation cost but keeps
      the determinism guarantee crystal-clear (the mock is bound to its
      context). `--real-llm` path correctly shares one `RealAnthropicClient`
      Arc across cases — token-counter and rate-limit budgets land on the same
      client instance, matching production semantics. `insights/eval.rs` is
      the cleaner module: `extract_numbers` is a hand-rolled char iterator
      (no regex dep added — good), `normalize_number` collapses thousands
      grouping and trailing zeros so context $5.10 matches output `5.1`,
      faithfulness/relevance are pure functions (easy to test, easy to reason
      about for future LLM-as-judge upgrades in Story 1.21+). Dead-code path
      `(None, None)` documented as `(impossible)` — acceptable defensive
      programming. The unused sentinel `client` binding on line 139-152 when
      `--real-llm=false` is the smallest cost of keeping the same loop shape;
      noted but not worth a fix (replaced inside the loop on every iter).

  - name: unit_tests
    verdict: PASS
    notes: >-
      Eval-specific tests present and passing in `insights::eval::tests`:
      `test_faithfulness_perfect`, `test_faithfulness_zero`,
      `test_faithfulness_vacuous_when_no_numbers`, `test_relevance_actionable`,
      `test_relevance_missing_action_verb`, `test_relevance_missing_number`,
      `test_relevance_empty_list_is_vacuous`, `test_extract_numbers_basic`,
      `test_extract_numbers_strips_trailing_punct`,
      `test_normalize_drops_trailing_zero` — 10 dedicated tests covering
      both happy paths and edge cases (vacuous score on empty insights,
      trailing-punct stripping, thousands-grouping normalization).
      `cargo test -p torven-core` run by QA: 160 lib + 0 doctest + 3
      anthropic_e2e + 0 anthropic helper + 3 ar2 ignored + 1 ar3 ignored +
      18 config + 4 history + 3 insights_e2e + 2 keychain (1 ignored macOS) +
      0/4 live (ignored) + 29 tui = 222 passing, 9 ignored, 0 failed.

  - name: acceptance_criteria
    verdict: PASS
    notes: '9/9 ACs verified — see acs_breakdown.'

  - name: no_regressions
    verdict: PASS
    notes: >-
      `cargo test --workspace` green (matches per-package totals — no test
      regressed). Story 1.15 `insights/*` module additions still compile and
      pass (the `eval.rs` stub was replaced with the real implementation; no
      other behaviour changes to budget/client/cancel/schema/llm_client beyond
      the additive `MockLlmClient::for_eval` constructor and `estimate_cost`
      helper). `cargo build --workspace` clean. `cargo fmt --all --check`
      clean. `cargo clippy --all-targets -- -D warnings` clean.

  - name: performance
    verdict: PASS
    notes: >-
      QA re-ran `cargo run -p torven-core --bin torven-evals -- --dataset
      crates/torven-core/evals/dataset.jsonl` end-to-end. Wall clock for the
      30-case run < 1s with cached build (well under the informal <5s ceiling
      for the mock path). Baseline metrics match the story Change Log
      exactly: Faithfulness=0.90, Relevance=1.00, Cost p50/p95=$0.0017,
      Latency p50/p95=0ms (mock is synchronous). Targets verified PASS —
      Faithfulness ≥ 0.85, Relevance ≥ 0.80, Cost ≤ $0.05. Per-case detail
      shows only eval-007 below the faithfulness target at 0.73, which is
      the deliberate multi-vendor aggregate signal documented in
      decision-log-1.17 D-1. Determinism confirmed — repeat runs produce
      identical numbers.

  - name: security
    verdict: PASS
    notes: >-
      Dataset scan with `grep -iE "(api_key|apiKey|sk-|sk_|Bearer |
      access_token|secret|password)"` returns zero hits across all 30 cases.
      All 30 `account_id` values match the 8-character hex hash format
      (`a1b2c3d4`, `b2c3d4e5`, ...) consistent with the
      `RealAnthropicClient::redact_payload` privacy invariant from Story
      1.15. `--real-llm` code path uses `std::env::var("ANTHROPIC_API_KEY")`
      and exits with usage if missing — the key never reaches stdout/stderr,
      never lands in the Markdown report (which only labels the LLM as
      "Real Anthropic claude-3-5-sonnet-20241022"), never gets logged. No
      new `tracing!`/`eprintln!`/`println!` lines in the binary touch the
      key (only `args.real_llm` boolean is read). The report's "Ideal
      references" footer is bounded to the first 3 cases — even if a
      future dataset addition included a sensitive phrase in
      `partial_ideal_response`, the truncation limits accidental exposure.
      `evals/results/` is gitignored at both `crates/torven-core/evals/
      results/` and root `evals/results/` — eval artifacts never leak to
      git history.

  - name: documentation
    verdict: PASS
    notes: >-
      `crates/torven-core/evals/schema.md` documents the JSONL fields,
      category/severity enums, distribution table, both metric semantics
      (faithfulness + relevance with the exact heuristic recipe), and a
      "How to add a new case" runbook. `README.md` "AI Insights Quality"
      section landed with the 2026-06-04 baseline metrics table, dataset
      distribution summary, and `cargo run --bin torven-evals` command.
      `prompts/insights.v1.md` frontmatter has `eval_baseline_score`
      populated with `date: 2026-06-04`, `llm: mock`, `dataset_size: 30`,
      `faithfulness: 0.90`, `relevance: 1.00`, `latency_p50_ms: 0`,
      `latency_p95_ms: 0`, `cost_p50_usd: 0.0017`, `cost_p95_usd: 0.0017`,
      `passed: 29`, `failed: 1` — exactly the PRD §6.2 contract. Story
      file File List exhaustive and Change Log captures the
      Ready→InProgress→InReview transitions with the per-case metric
      ledger. Module-level docs in `eval.rs` explain the heuristic
      hypotheses + limitations honestly (no over-promising). The
      gitignored decision-log-1.17.md (D-1 through D-4) referenced from
      the dev Change Log row, with D-1 (eval-007 aggregate by-design),
      D-2 (regex accepts `42` without `$`), D-3 (chars/4 cost estimation),
      D-4 (sequential execution) acknowledged as v1 acceptable tradeoffs.

