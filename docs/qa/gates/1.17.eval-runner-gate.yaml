decision_log_summary:
  D-1: >-
    eval-007 fail by design — mock aggregates per-vendor totals so the
    cross-vendor faithfulness drop (210000 + 340000 ≠ each vendor's
    individual figures) is the regression signal CI is meant to detect.
    Documented in dataset comments and decision-log-1.17.
  D-2: >-
    faithfulness regex accepts `42` without currency/unit prefix —
    biases toward over-estimation (safer error direction for a baseline)
    until LLM-as-judge eval lands (Story 1.21+).
  D-3: >-
    chars/4 cost estimation reused from `budget::estimate_input_tokens`
    — refinement to real tokenizer deferred to Story 1.21.
  D-4: >-
    Sequential per-case execution preserved on purpose (concurrent
    runs would muddy the latency numbers that PRD §6.1 reports as
    p50/p95).

