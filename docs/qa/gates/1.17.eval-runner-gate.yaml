acs_breakdown:
  AC-1: >-
    PASS — `crates/torven-core/evals/dataset.jsonl` has exactly 30 lines
    (verified `wc -l`). Each line parses as JSON with required fields
    `id`, `usage_snapshot` (InsightsContext shape), `expected_category`,
    `expected_severity`, `partial_ideal_response`. The runner consumes
    all 30 without parse errors. Distribution exact match to story spec:
    10 trend, 8 anomaly, 7 budget_risk, 5 optimization_opportunity;
    15 info, 10 warning, 5 critical.
  AC-2: >-
    PASS — `crates/torven-core/evals/schema.md` documents all required
    fields with type table, usage_snapshot shape detail (mirrors
    `insights::schema::InsightsContext`), distribution tables, metric
    semantics (faithfulness + relevance heuristic recipes with formula
    and target thresholds), latency/cost definitions, and "How to add
    a new case" runbook. Privacy invariant called out
    explicitly (8-char hashes, no api_key, no plaintext account names).
  AC-3: >-
    PASS — `cargo run -p torven-core --bin torven-evals -- --dataset
    crates/torven-core/evals/dataset.jsonl` (re-run by QA against
    commit a9e0ac0) produces the Markdown report with every required
    metric: Cases total/passed/failed (30/29/1), Faithfulness 0.90
    (target ≥0.85 PASS), Relevance 1.00 (target ≥0.80 PASS), Latency
    p50/p95 0ms (synthetic — mock is sync), Cost p50/p95 $0.0017
    (target ≤$0.05 PASS), plus Failures section + Per-Case Detail table
    + Notes + Errors + Ideal references. Baseline targets section is
    implicit in the table's Target column.
  AC-4: >-
    PASS — `crates/torven-core/src/insights/eval.rs` exports
    `pub fn compute_faithfulness(output: &InsightsOutput, context:
    &InsightsContext) -> f64` (extracts numeric tokens from output text,
    compares against context numeric tokens, returns matches/total or
    1.0 vacuous) and `pub fn compute_relevance(output: &InsightsOutput)
    -> f64` (per InsightItem.message checks for ACTION_VERBS membership
    AND a numeric token, returns actionable/total or 1.0 vacuous).
    Both signatures match the story's recipe; both heuristics are
    documented module-level with limitations called out honestly.
  AC-5: >-
    PASS — QA re-tested `cargo run -p torven-core --bin torven-evals --
    --dataset crates/torven-core/evals/dataset.jsonl --output
    /tmp/torven-evals-qa-test.md` — file was created (3716 bytes),
    contents identical to stdout output, eprintln confirms
    `torven-evals: wrote report to /tmp/torven-evals-qa-test.md`. The
    runner also calls `fs::create_dir_all(parent)` when the parent
    doesn't exist, so `--output evals/results/report-2026-06-04.md`
    works out of the box.
  AC-6: >-
    PASS — `args.real_llm: bool` (clap `--real-llm` flag,
    `default_value_t = false`). When true, reads `ANTHROPIC_API_KEY`
    via `std::env::var(...)`, exits with code 2 + clear stderr message
    if absent. When present, constructs
    `Arc::new(RealAnthropicClient::new(key))` from Story 1.15 and
    reuses it across all 30 cases. Without the flag,
    `MockLlmClient::for_eval(&case.usage_snapshot)` is rebuilt per case
    (deterministic, no network). QA did NOT run the real-LLM path
    (would consume API credits) — code review only; pattern matches
    Story 1.15's `RealAnthropicClient` test-coverage already validated.
  AC-7: >-
    PASS — `cargo run -p torven-core --bin torven-evals -- --help`
    re-run by QA produces clear usage block: long_about explains the
    binary purpose ("Runs a labeled JSONL dataset through MockLlmClient
    (default) or RealAnthropicClient and emits a Markdown report ..."),
    each flag has a doc comment, `-h` summary works, exit code 0.
    Default for `--dataset` is `crates/torven-core/evals/dataset.jsonl`
    so a bare `cargo run --bin torven-evals` works without arguments
    (verified — produces stdout report).
  AC-8: >-
    PASS — `.gitignore` has BOTH `crates/torven-core/evals/results/`
    (relative path from repo root) AND `evals/results/` (in case the
    binary is run from inside the crate directory and writes to a
    sibling relative path). `git status` confirms no `report-*.md`
    files are tracked.
  AC-9: >-
    PASS — All 10 eval-specific tests in `insights::eval::tests`
    (test_faithfulness_perfect, test_faithfulness_zero,
    test_faithfulness_vacuous_when_no_numbers, test_relevance_actionable,
    test_relevance_missing_action_verb, test_relevance_missing_number,
    test_relevance_empty_list_is_vacuous, test_extract_numbers_basic,
    test_extract_numbers_strips_trailing_punct,
    test_normalize_drops_trailing_zero) run as normal `#[test]` (no
    `#[ignore]`). Verified via `cargo test -p torven-core eval` — 10
    tests pass. The runner binary itself is `cargo run --bin
    torven-evals`, separate from the test path.

