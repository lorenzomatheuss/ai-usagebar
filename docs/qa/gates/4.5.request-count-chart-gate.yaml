decisions_review:
  - decision: 'ChartMetric enum co-located in AggregatedSample.swift'
    verdict: JUSTIFIED
    rationale: >-
      The story permitted "OU adicionar em AggregatedSample.swift se
      @dev preferir". The dev's choice is well-reasoned: (1)
      StackedAreaChart, MiniVendorChart, and PerVendorGrid all
      consume both `AggregatedSample` and `ChartMetric` together —
      keeping them in one file means a single `import` boundary; (2)
      the enum is structurally trivial (2 cases × 2 computed
      strings); (3) when Wave 5 introduces tokens/latency metrics,
      the enum can graduate to its own file with a single move.
      Documented forward path is a strong signal of careful
      thought.

  - decision: 'IntegerFormatStyle<Int>() over Decimal.FormatStyle() for requests Y-axis'
    verdict: JUSTIFIED
    rationale: >-
      Both work on macOS 13. The dev's choice avoids pulling a
      Foundation `Decimal` type into a chart layer that doesn't
      otherwise need it. `IntegerFormatStyle<Int>()` matches the
      semantic of "no decimals, no currency" directly. Inline
      comment (lines 158-164) makes the choice explicit so future
      maintainers don't accidentally swap it.

  - decision: 'metricValue() + formattedMetricValue() helpers (not extension on AggregatedSample)'
    verdict: JUSTIFIED
    rationale: >-
      Putting metric-projection logic on AggregatedSample directly
      would force the struct to know about ChartMetric — coupling
      that's avoidable. The local helpers in each chart file
      maintain a one-way dependency: charts know about metrics,
      metrics don't know about charts. When Wave 5 adds the third
      metric, only the chart files grow a switch case (the enum
      grows a single case + yAxisLabel pair).

  - decision: 'ViewMode picker width 220→180; ChartMetric width 160; top-bar single-line'
    verdict: JUSTIFIED (with inline math)
    rationale: >-
      Story Risk #3 flagged top-bar density. The dev's choice (a) —
      reduce widths — is the least invasive option that preserves
      visual hierarchy. Width math: ~280 (DateRangePicker default) +
      180 (ViewMode) + 160 (ChartMetric) + 36 (paddings/spacing) =
      ~656pt total, leaving ~244pt of headroom at the 900pt window
      default. When DateRangePicker expands into Custom mode (two
      DatePickers ≈ +280pt), the layout still fits (~656 - default
      DateRangePicker width + custom mode = ~936pt — close to but
      not exceeding the window, since SwiftUI will compress the
      Spacer rather than overflow). Documented inline so future
      changes can reason against the same model.

  - decision: 'Same metric default = .cost on all 3 chart sites'
    verdict: JUSTIFIED (non-breaking by construction)
    rationale: >-
      Triple-default = .cost on StackedAreaChart, MiniVendorChart,
      and PerVendorGrid means every prior caller (Stories 4.3 +
      4.4, plus any future test sites that omit the metric param)
      gets the legacy Cost behavior. MainWindowView is the only
      site that passes `metric: chartMetric` explicitly. Mirrors
      Story 4.4's `selectedVendor: String? = nil` non-breaking
      pattern — established Wave 4 convention.

  - decision: 'AC-6 verification-only (no modification to fromFFI)'
    verdict: JUSTIFIED
    rationale: >-
      The story's AC-6 + T5 explicitly say "Confirmar que a foundation
      4.3 já preserva o campo (não dropa em silêncio no mapping)". The
      dev correctly did NOT modify the existing mapping
      (`requestCount: Int(bucket.requestCount)` line 150 in
      AggregatedSample.swift), only verified it. Touching the mapping
      would have been scope creep — Story 4.3's QA gate already
      validated that path, and 4.0.5's Rust tests cover the source
      data integrity.

smoke_ux_recommendation:
  policy: 'Code-level PASS; runtime smoke = Lorenzo bench (NOT gate-blocking)'
  rationale: >-
    Per the Wave's established pattern (Stories 3.2/3.3/4.1/4.2/4.3/4.4
    SMK-series). The metric-toggle checklist for Lorenzo's bench at
    Wave 4 close (batched with Story 4.6 SMK-aggregate):
      1. Open Main Window — default mode = Aggregate + metric = Cost
         (Y-axis is currency-formatted, hover card shows "$X.XX")
      2. Click "Requests" — Y-axis switches to integer formatting,
         hover card now shows "N requests"
      3. Switch to Per-vendor + Requests — mini-chart headers show
         "N requests" total
      4. Cost ↔ Requests rapid-toggle: state independence verified
         (dateRange + viewMode + selectedVendor all preserved)
      5. Reduce Motion enabled — metric toggle is instant (the
         `.animation(_, value: viewMode)` in chartBody doesn't fire
         on `chartMetric` change, so no transition needed; but if it
         did, Reduce Motion would suppress)
      6. Resize window narrow — top bar (3 segmented pickers + date
         picker) still fits on one line until below ~656pt window
         width
    Code-level inspection confirms all 6 are correctly implemented.

