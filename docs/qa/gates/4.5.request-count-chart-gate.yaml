status_reason: >-
  Story 4.5 lands the Cost/Requests metric parametrization with
  exemplary surgical precision — 286 LOC added across 5 files, all
  default `metric: ChartMetric = .cost` parameters preserve every
  prior caller verbatim (Stories 4.3, 4.4 non-breaking by
  construction). The `ChartMetric` enum is co-located with the other
  chart-domain types in AggregatedSample.swift with an inline
  comment explaining the decision tree (single import for callers,
  trivial structure, will be promoted to its own file when Wave 5
  introduces additional metrics). The Y-axis format flip uses
  `IntegerFormatStyle<Int>()` (not `Decimal.FormatStyle()`) — a
  cleaner choice that avoids pulling in a Foundation type the chart
  doesn't otherwise need, and is macOS-13-safe. The `metricValue
  (_:)` + `formattedMetricValue(for:)` helper pair in both
  StackedAreaChart and MiniVendorChart is structurally symmetric and
  easy to grow when Wave 5 adds tokens/latency metrics — single
  switch to extend per chart. Top-bar density (Risk #3 in story doc)
  was handled cleanly: ViewMode picker tightened 220→180pt,
  ChartMetric set to 160pt, with inline width math comment
  documenting the ~244pt headroom for DateRangePicker's Custom mode
  expansion. AC-5 (state independence — toggling metric doesn't
  reset range or view mode) falls out naturally from the three
  states being independent `@State` properties on ChartContent.
  AC-6 (`TimeBucket.request_count: u32` → `Int`) was a verification-
  only step — confirmed unchanged in `AggregatedSample.fromFFI(_:)`
  line 150 (`requestCount: Int(bucket.requestCount)`) — dev correctly
  did not modify the established mapping. Build gate green per
  independently re-verified `xcodebuild Debug BUILD SUCCEEDED` on
  branch HEAD c079a5b. `cargo test --workspace` 260+ passing per
  dev evidence (up from 242 since Story 4.0.5 follow-up tests
  landed during the Wave 4 window in main — zero regression).
  **CodeRabbit rate-limit persists** at gate time (REL-001 carry from
  Story 4.4) — fell back to manual line-by-line review across the 5
  files, identified zero CRITICAL/HIGH; the dev's own pre-commit CR
  run (before the limit was hit on the QA side) reported 0 findings
  on Story 4.5 code (4 out-of-scope hits on `docs/cases-drafts/`
  untracked file). All 6 ACs verified at code level (vs 9/10 for
  4.4 and 6/7 for 4.2) — the cleanest AC completion of the Wave so
  far, reflecting the story's narrower scope and pure reuse posture.
  Score 9.4 vs 10 reflects (1) REL-001 CodeRabbit rate-limit
  reduces gate confidence, (2) SMK-005 runtime smoke deferred per
  precedent, (3) Y-axis format flip on .requests was not visually
  validated against real data (preview eyeball only).

