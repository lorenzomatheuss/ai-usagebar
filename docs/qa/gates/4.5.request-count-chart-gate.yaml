    PASS — apple/Torven/MainWindow/Charts/AggregatedSample.swift
    lines 185-200 declare `enum ChartMetric: String, CaseIterable,
    Identifiable { case cost = "Cost"; case requests = "Requests";
    var id: String { rawValue }; var yAxisLabel: String { switch
    self { case .cost: return "Cost (USD)"; case .requests: return
    "Requests" } } }` — verbatim per AC spec. Co-location decision
    documented in 16-line header comment with trade-offs and
    forward path.

  AC-2: >-
    PASS — apple/Torven/MainWindow/Charts/StackedAreaChart.swift
    line 72 declares `var metric: ChartMetric = .cost` (default
    preserves 4.3 callers). Lines 107-112 define `metricValue(_:)`
    helper. Line 137 `AreaMark(y: .value(metric.yAxisLabel,
    metricValue(sample)))` — uses the helper. Lines 165-169 Y-axis
    conditional: `if metric == .cost { AxisMarks(format: .currency(
    code: "USD")) } else { AxisMarks(format: IntegerFormatStyle<Int>()) }`.
    The dev's choice of `IntegerFormatStyle<Int>()` over
    `Decimal.FormatStyle()` is documented inline (lines 158-164) —
    avoids unnecessary Foundation type pull. Existing snapshot/preview
