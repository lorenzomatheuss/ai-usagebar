status_reason: >-
  Story 2.2 cleanly extracts the SF Symbol from `TorvenApp.swift` into a
  configurable `MenuBarLabel` struct exactly per the ACs. `MenuBarLabel.swift`
  is a 25-line stateless View (no `@State`, no `@EnvironmentObject`, no Rust
  core dependency — per AC-1's strict statelessness mandate), exposes
  `static let defaultSymbol = "chart.bar.fill"` so the call site never
  hardcodes the string, and takes `let symbol: String` as the configurable
  knob that Wave 7 (AR-8) will drive dynamically. `TorvenApp.swift` migrated
  from the `("Torven", systemImage:)` form to the label-view trailing
  closure form `MenuBarExtra { content } label: { MenuBarLabel(symbol:
  MenuBarLabel.defaultSymbol) }` per AC-2 verbatim. `apple/Torven/MenuBar/.gitkeep`
  removed (AC-4) — `MenuBarLabel.swift` is now the real file in the folder.
  XcodeGen recursive discovery picked up the new file with zero project.yml
  changes (AC-5). Cargo workspace stays green (222 tests, clippy strict
  clean, fmt clean — AC-7). The only minor mark-down is on AC-6 evidence:
  individual smoke run was [AUTO-DECISION] consolidated with Story 2.3's
  smoke (same icon, same status bar render path); the rationale is
  documented in the Change Log and the consolidation is defensible (Story
  2.3 build PID 76680 validates the same chart.bar.fill icon visibility
  end-to-end). 7/7 ACs verified — pragmatic CONCERNS-grade test-evidence
  pattern that does not warrant CONCERNS overall because the consolidation
  is honest, documented, and the alternative coverage (build green +
  Story 2.3 smoke covering the same icon) is sufficient.

