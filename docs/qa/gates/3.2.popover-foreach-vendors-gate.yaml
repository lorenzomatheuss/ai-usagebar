status_reason: >-
  Wave 3's middle story executes the ForEach scale-up exactly as scoped
  AND closes UX-Q1 empirically per ADR §8 with a clean audit trail.
  `PopoverView.swift` replaced the Story 3.1 `if-let openRouter`
  defensive block with `VStack(spacing: 8) { ForEach(coreBridge.vendors,
  id: \.id) { vendor in VendorCard(vendor: vendor) } }
  .padding(.horizontal, 16)`, preserving the header "Torven" above the
  list and keeping `Spacer(minLength: 0)` at the bottom — exactly the
  AC-3 canonical body shape. The frame moved from 360×420 (PRD starting
  point) to **380×540** after the smoke run revealed Gemini (last in
  the canonical `get_vendor_list()` order Anthropic→OpenAI→OpenRouter→
  Z.AI→Gemini) being clipped at 360×420. Lorenzo confirmed both checkpoints
  (caso A reprovou, caso B aprovou) in the dev session — dual confirmation
  serves as the AC-5 evidence trail. ADR §8 UX-Q1 marked **CLOSED 2026-06-04
  (Story 3.2)** with the adopted Opção A + the dispensed B/C/D audit trail.
  AC-9 strictly observed — `VendorCard.swift` was not modified by this
  story in its own scope (Story 3.3 later adds tap+sheet to the same file,
  validated separately in the 3.3 gate). Score 9.5 vs 10 reflects the
  AC-5 screenshot dispensation in favor of dual textual confirmation; AC-5
  is honored in spirit (proof of UX-Q1 decision) but not in literal form
  (no screenshot file). Same calibration as Wave 2 Story 2.3 (9.5).

