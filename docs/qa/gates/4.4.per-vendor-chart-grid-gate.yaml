acs_breakdown:
  AC-1: >-
    PASS — apple/Torven/MainWindow/Charts/PerVendorGrid.swift declares
    `struct PerVendorGrid: View` (line 46) with all 4 parameters from
    the AC (`chartData`, `samplesByVendor`, `selectedVendor`,
    `onVendorSelected`). `LazyVGrid(columns: [GridItem(.adaptive(
    minimum: 260), spacing: 16, alignment: .top)], spacing: 16)`
    (lines 52-54, 73) matches the AC's "adaptive(minimum: 260)" recipe
    exactly. `ForEach(chartData.vendors, id: \.self) { vendor in
    MiniVendorChart(...) }` (lines 74-81) iterates the pre-sorted
    vendor list and instantiates one card per vendor.

  AC-2: >-
    PASS — apple/Torven/MainWindow/Charts/MiniVendorChart.swift
    declares `struct MiniVendorChart: View` (line 43) receiving
    `vendorId`, `samples`, `onTap`. `Chart { ForEach(samples) {
    LineMark(x: .value("Time", $0.timestamp), y: .value("Cost",
