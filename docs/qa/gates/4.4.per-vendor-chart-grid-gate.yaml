  AC-3: >-
    PASS — apple/Torven/MainWindow/Charts/ChartViewModel.swift adds:
    `var samplesByVendor: [String: [AggregatedSample]] { Dictionary(
    grouping: chartData.samples, by: \.vendor) }` (lines 70-72) —
    matches AC verbatim. `@Published private(set) var selectedVendor:
    String?` (line 62). Method `selectVendor(_ vendorId: String?)`
    (lines 106-116) implements the toggle: explicit-nil → clear,
    same-vendor → nil, diff-vendor → swap. ChartViewModel init
