checks_detail:
  - name: code_review
    verdict: PASS (manual — CodeRabbit rate-limited)
    notes: >-
      **MiniVendorChart.swift** (170 LOC, new) is the smallest of the
      Story 4.4 surface and the most focused. `VStack(alignment:
      .leading, spacing: 8) { header; chartArea }` (line 67) inside a
      RoundedRectangle 8pt corner + controlBackgroundColor fill +
      subtle shadow (lines 73-77) is exactly the "card" pattern AC-2
      describes. Tap target is the whole card via `.contentShape(
      Rectangle()).onTapGesture { onTap?(vendorId) }` (lines 81-84) —
      the entire surface is interactive, not just the header. Header
      (lines 91-109) renders `displayName` (.headline) + `totalCost
      .formatted(.currency(code: "USD")) total` (.caption,
      secondary) plus a 10×10 color swatch matching the vendor's
      legend color — a small UX win that disambiguates which line
      belongs to which vendor without forcing the user to read a
      per-card legend. `chartArea` (lines 113-145) handles empty-state
      inline ("No data" centered) and the line chart with
      `.foregroundStyle(vendorColor).interpolationMethod(.catmullRom)`
      matching the parent. Compact axes (`AxisMarks(values:
      .automatic(desiredCount: 3))`) on both x and y avoid visual
      clutter at the smaller scale. Accessibility label combines all
      children and includes total cost (line 85-86) — good a11y. **No
      hover annotation present** — see DES-002.
      **PerVendorGrid.swift** (193 LOC, new) wraps the grid in a
      ScrollView (line 72) so a narrow window can scroll if cards
      overflow. `LazyVGrid(columns: [GridItem(.adaptive(minimum: 260),
      spacing: 16, alignment: .top)])` (lines 52-54) gives the
      responsive 2-or-3 column layout the story prescribes.
      `ForEach(chartData.vendors, id: \.self)` (line 74) iterates the
      pre-sorted vendor list. Selection overlay (lines 87-93) uses
      the always-render-with-conditional-lineWidth trick to avoid
      geometry jitter on toggle. Empty state (lines 100-121) mirrors
      StackedAreaChart's macOS 13 fallback. Three #Previews
      (populated, with selection, empty) at the bottom give visual
      verification coverage. **ChartViewModel.swift** (now 205 LOC,
      +41 from Story 4.3) adds `@Published private(set) var
      selectedVendor: String?` (line 62), `samplesByVendor` computed
      (lines 70-72) via `Dictionary(grouping: chartData.samples,
      by: \.vendor)`, and `selectVendor(_:)` (lines 106-116) with
      toggle semantics: tap same → nil, tap diff → swap, explicit
      nil → clear. All other Story 4.3 internals (chartData,
      errorMessage, cancellation-aware Task, lazy ffiInitHistory)
      preserved verbatim. **StackedAreaChart.swift** (now 332 LOC,
      +1 LOC net — the cross-story addition is tiny) adds
      `selectedVendor: String? = nil` (line 67, default = nil
      preserves Story 4.3 callers), `visibleSamples` computed
      (lines 93-96) that filters samples by selectedVendor when
      non-nil, and switches the ForEach to iterate `visibleSamples`
      (line 102). Empty state check now uses `visibleSamples.isEmpty`
      (line 81) — correct because a single-vendor filter against an
      empty subset should show empty state. Color scale now uses
      `chartVendorColorMapping` (line 121, was private in 4.3).
      **AggregatedSample.swift** (now 240 LOC, +123 LOC) adds the
      promoted vendor helpers at internal scope (lines beyond 168):
      `chartVendorColorMapping: KeyValuePairs<String, Color>`,
      `chartVendorColor(for vendor: String) -> Color`,
      `chartVendorDisplayName(_ vendorId: String) -> String`. The
      promotion is correct — these are shared chart infra, not
      AggregatedSample internals, but co-locating them with the
      ChartData type keeps the chart-domain types in one file. No
      breaking changes to AggregatedSample, ChartData, or
      `fromFFI(_:)`. **MainWindowView.swift** (now 163 LOC, +71/-21
      from 4.3) adds the file-scope `ChartViewMode` enum (lines
      24-29) and the `viewMode` state + ViewMode Picker + chartBody
      switch in `ChartContent` (lines 61, 79-104, 131-156). Top bar
      now hosts BOTH DateRangePicker AND the segmented ViewMode
      Picker side-by-side (lines 108-127). Reduce Motion guard on
      `.animation(_, value: viewMode)` keeps mode transitions
      respectful when the system setting is on. No retain cycles
      introduced; all VMs still `@StateObject` (root) /
      `@ObservedObject` (passed) per established pattern.

  - name: unit_tests
    verdict: PASS
    notes: >-
      Rust regression: `cargo test --workspace` per dev evidence 242+
      passing (zero regression from 4.3 baseline). Story 4.4 is
      Swift-only — no Rust changes. Swift side has no XCTest target
      (Wave 7 backlog). The `selectVendor(_:)` toggle logic is the
      only new piece with meaningful branch coverage; the function
      is 8 LOC with 3 paths (explicit nil, same-vendor → nil, diff
      vendor → swap), all visually verifiable via the #Preview "With
      selection" block in PerVendorGrid. Calibration consistent with
      Stories 2.1-2.3 (PASS 9.83) and 3.1-3.3 / 4.1 / 4.2 / 4.3.

  - name: acceptance_criteria
    verdict: PASS
    notes: '8/9 ACs verified at code level; AC-6 partially deferred (DES-002 — see acs_breakdown).'

  - name: no_regressions
    verdict: PASS
    notes: >-
      Story 4.3 contract preserved — StackedAreaChart's existing
      callers continue to compile and behave identically because
      `selectedVendor: String? = nil` defaults to "no filter". The
      Aggregate path in MainWindowView passes
      `chartViewModel.selectedVendor` explicitly (line 138), so when
      the user hasn't selected a vendor the call is equivalent to
      `selectedVendor: nil`. ChartViewModel's init signature
      `(mainViewModel:)` is preserved; only added members. The
      promotion of `vendorColorMapping` from `private` (in
      StackedAreaChart.swift) to internal `chartVendorColorMapping`
      (in AggregatedSample.swift) is a non-breaking re-scope —
      StackedAreaChart now refers to the new internal name. Story
      4.2 contracts (DateRangePicker, MainWindowViewModel) untouched.
      Story 4.1 (MainWindowController, ⌘1 hotkey) untouched. Wave 3
      popover files untouched. xcodebuild Debug BUILD SUCCEEDED
      independently re-verified at gate time on branch HEAD 1fa46b8.

  - name: performance
    verdict: PASS (with observation)
    notes: >-
      AC-8 NFR: 5 × 30 = 150 LineMark total for 30d daily; 5 × 168 =
      840 LineMark total for 7d hourly. `LazyVGrid` defers the
      off-screen chart rendering until scrolled into view, which is a
      meaningful win for the worst-case path. `samplesByVendor` is
      computed on every read — for the 840-sample worst case,
      `Dictionary(grouping: by:)` is O(n) (sub-millisecond on the dev
      box). SwiftUI body evaluations could in theory trigger this
      multiple times per second; if profiling ever reveals it as a hot
      path, memoization on `chartData` mutation is a simple add. **Not
      blocking** — the chosen shape is correct for the expected payload
      size and aligns with the project's "compute don't cache" pattern
      established in Story 4.3. The selection-highlight overlay's
      always-render-with-lineWidth-0 trick avoids re-layout passes that
      would otherwise fire on every toggle.

  - name: security
    verdict: PASS
    notes: >-
      No new attack surface. No new FFI calls (consumes Story 4.0.5's
      ffi_query_aggregated via Story 4.3's ChartViewModel). Vendor
      identifiers in tap callbacks are pure pass-through to the
      ChartViewModel; no string concatenation into SQL or shell. The
      `Color(nsColor: .controlBackgroundColor)` lookup is a system
      constant. No keychain, network, or file I/O at the Swift layer.

  - name: documentation
    verdict: PASS
    notes: >-
      MiniVendorChart.swift header (lines 1-37) walks through 4
      architectural choices (LineMark vs AreaMark, pre-filtered
      samples vs ChartData+vendorId, custom display name helper, macOS
      13 compatibility). PerVendorGrid.swift header (lines 1-42)
      documents the LazyVGrid column reasoning with concrete
      breakpoints (small/medium/wide) and explains the
      samplesByVendor pass-down decision. ChartViewModel.swift's new
      `selectVendor(_:)` (lines 95-105) has a docstring explaining the
      toggle behavior + why it lives on the model. MainWindowView's
      ChartViewMode enum (lines 17-29) flags the future graduation
      path to `@AppStorage` when v1.5+ adds settings sync.
      AggregatedSample.swift's promoted helpers carry inline
      docstrings on why they're internal-scoped. Story file Dev
      Agent Record documents the design decisions including the
      ViewMode picker placement (inside ChartContent, not
      MainWindowView), the selection-jitter avoidance trick, and
      the simplified MiniVendorChart hover.

