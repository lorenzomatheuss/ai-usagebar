status_reason: >-
  Story 4.4 lands the Per-vendor mini-chart grid + ViewMode picker
  cleanly. The 5-vendor LazyVGrid + click-to-filter + non-breaking
  cross-story modification to StackedAreaChart all work as the AC
  spec describes. The cross-story modification (Risk #3 in the
  story doc) is executed with a default `selectedVendor: String? =
  nil` parameter on `StackedAreaChart`, so the Story 4.3 behaviour
  is preserved verbatim when no filter is active — non-breaking by
  construction. ChartViewModel's `selectVendor(_:)` toggle semantics
  (re-tap clears, different-tap swaps, explicit-nil clears) are
  centralized at the model layer, keeping `PerVendorGrid` a pure
  presentation view. The selection-highlight border on the
  `MiniVendorChart` always renders with `lineWidth: 0` when
  inactive — a thoughtful detail that prevents the ~1pt geometry
  jitter that would otherwise show when the overlay appears or
  disappears on toggle. The shared chart vendor helpers
  (`chartVendorColorMapping`, `chartVendorColor(for:)`,
  `chartVendorDisplayName(_:)`) were correctly promoted from
  `private` in StackedAreaChart to `internal` in
  AggregatedSample.swift — single source of truth for the 5-vendor
  brand palette, reusable by Stories 4.5/4.6. `LazyVGrid` with
  `.adaptive(minimum: 260)` + `ScrollView` wrapper handles narrow-
  window edge cases gracefully. macOS 13 empty-state fallback
  shipped in PerVendorGrid mirrors the StackedAreaChart pattern.
  Build gate green per dev evidence (cargo test --workspace 242+
  passing, xcodebuild Debug BUILD SUCCEEDED — independently
  re-verified at gate time on branch HEAD 1fa46b8). **CodeRabbit
  rate-limit hit** at gate time (`Review limit reached` per the
  shared CR account) — code review fell back to manual line-by-line
  inspection across the 5 files (2 new + 3 modified); no CRITICAL
  or HIGH issues identified in manual review, but the absence of
  automated CR coverage is logged as REL-001 for the audit trail.
  AC-6 (hover annotation in MiniVendorChart) was **fully omitted**
  rather than simplified — the dev's report describes "axis-only
  hover" but inspection of MiniVendorChart.swift confirms no
  `chartOverlay` or `onContinuousHover` is present at all. The
  story permits a simplified version ("Pode ser simplificado:
  apenas .chartOverlay básico"); strict reading wants *some*
  overlay. Defensible UX call (a 260pt card with a hover tooltip
  would feel heavy) — logged as DES-002 with a recommendation for
  Wave 5 polish to revisit if user feedback warrants. Smoke
  runtime (mode switch + click-to-filter + filtered Aggregate)
  deferred to Lorenzo's bench, batched with Wave 4 closing story
  (4.6 Budget Burn) per project precedent. Score 9.2 vs 10
  reflects (1) AC-6 hover omission as DES-002, (2) CodeRabbit
  rate-limit reduces gate confidence as REL-001 (manual review
  covers the gap), (3) SMK-004 runtime smoke deferral.

