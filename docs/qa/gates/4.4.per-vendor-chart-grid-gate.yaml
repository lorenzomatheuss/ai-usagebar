issues:
  - id: DES-002
    severity: low
    category: code
    description: >-
      MiniVendorChart.swift omits hover annotation entirely — no
      `chartOverlay` or `onContinuousHover` modifiers. The story's
      AC-6 allows simplification ("Pode ser simplificado: apenas
      .chartOverlay básico") but implicitly expects some form of
      hover feedback. The dev's chartArea (lines 113-145) configures
      `.chartXAxis` and `.chartYAxis` only. Defensible UX call —
      a 260pt card with a hover tooltip would feel visually heavy
      and competes with the click-to-filter primary interaction —
      but a strict reading wants *some* overlay.
    suggested_action: >-
      Defer to Wave 5 polish. Could be addressed by adding a small
      `.chartOverlay { proxy in GeometryReader { _ in } }` plus a
      lightweight x-axis snap (similar to StackedAreaChart's
      pattern but without the floating annotation card) — purely
      visual feedback that a hover is happening. Decision point:
      revisit only if Lorenzo's runtime smoke or user feedback
      flags the missing hover as a discoverability problem.

  - id: REL-001
    severity: low
    category: testing
    description: >-
      CodeRabbit pre-review hit the rate limit at gate time
      (`Review limit reached: To unlock additional reviews,
      purchase usage credits…`). Story 4.4 was reviewed manually
      via line-by-line inspection of the 5 changed files
      (~600 LOC). Manual review identified zero CRITICAL or HIGH
      severity issues but the absence of automated CR coverage
      slightly reduces gate confidence vs. Story 4.3 (which had
      "No findings" from CR).
    suggested_action: >-
      Either (a) wait until the CR subscription's billing window
      resets and re-run `coderabbit --prompt-only -t committed
      --base main` on this branch post-merge to add the audit-
      trail entry, or (b) carry forward as a known gap into the
      Wave 4 close handoff. Recommend (b) — the manual review
      was thorough and Stories 4.5/4.6's CR scans will validate
      the same code if it persists across stories.

  - id: SMK-004
    severity: low
    category: testing
    description: >-
      Runtime smoke (Aggregate↔Per-vendor mode toggle, click-to-
      filter, selection border visual, Reduce Motion compliance)
      deferred to Lorenzo bench per project precedent. Code-level
      inspection confirms the logic is correct; real-macOS
      interaction not yet recorded textually.
    suggested_action: >-
      Batch the 7-step smoke checklist (see
      `smoke_ux_recommendation` above) into the Wave 4 closing
      story's Change Log alongside SMK-001/SMK-002/SMK-003.

  - id: PRF-001
    severity: low
    category: performance
    description: >-
      `samplesByVendor` is a computed property on ChartViewModel
      that performs `Dictionary(grouping: by:)` (O(samples)) on
      every read. SwiftUI may call PerVendorGrid's body multiple
      times per second during rapid state changes (e.g. picker
      switching). For 840-sample worst case this is sub-millisecond
      on Apple Silicon — non-issue today, but worth flagging if
      Wave 5's tokens chart or future filters extend the sample
      count substantially.
    suggested_action: >-
      Defer. If profiling ever shows this as hot, memoize by
      caching the grouping in a stored property invalidated on
      `chartData` `didSet`. Trivial refactor when needed.

