decisions_review:
  - decision: 'Shared chart helpers promoted to AggregatedSample.swift (chartVendorColorMapping/Color/DisplayName)'
    verdict: JUSTIFIED (single source of truth)
    rationale: >-
      Story 4.3's `vendorColorMapping` was `private` in
      StackedAreaChart.swift. Story 4.4 needs the same palette for
      MiniVendorChart's `.foregroundStyle(vendorColor)` and for the
      selection border in PerVendorGrid. Three options were on the
      table: (a) duplicate the dictionary in a new file, (b) promote
      to `internal` in StackedAreaChart.swift, (c) move to
      AggregatedSample.swift. The dev chose (c) — colocating the
      palette with the chart-domain types in AggregatedSample.swift
      keeps the chart layer's shared infra in one file and leaves
      StackedAreaChart.swift focused on its single chart. Stories
      4.5/4.6 will benefit from the shared location.

  - decision: 'ViewMode Picker placed inside ChartContent (not MainWindowView)'
    verdict: JUSTIFIED
    rationale: >-
      ChartContent already owns the chart view model and the chart
      layout. The ViewMode picker is a sibling control that mutates
      a local state (viewMode) which only affects chartBody — no
      cross-cutting concern that would justify lifting it to
      MainWindowView. Co-locating the picker with the chart view
      models keeps the layout logic locally readable and avoids
      prop-drilling. Future stories adding additional top-bar
      controls (4.5 Cost/Requests, 4.6 Budget Burn placement) can
      follow the same pattern.

  - decision: 'Selection border always rendered with lineWidth: 0 when inactive'
    verdict: JUSTIFIED (UX polish at zero cost)
    rationale: >-
      The alternative (`if selectedVendor == vendor { .overlay(...) }`)
      would add and remove the overlay's frame on toggle, which
      SwiftUI handles by recomputing the card's outer bounds — a
      ~1pt geometry jitter visible to the human eye if a user is
      rapidly clicking through vendors. Always rendering the
      RoundedRectangle.stroke with lineWidth: 0 keeps the card's
      bounding box identical and reduces toggle to a single property
      animation. No measurable cost since SwiftUI elides zero-width
      strokes from the render pass.

  - decision: 'samplesByVendor computed (not cached @Published)'
    verdict: JUSTIFIED
    rationale: >-
      Caching would require manual invalidation every time
      `chartData` is republished (FFI reload, errorMessage publish
      side-effects, etc.). The compute cost is O(samples) — for
      840 worst-case samples this is sub-millisecond on the dev
      box. Trade-off: occasional re-grouping on every SwiftUI body
      evaluation that touches PerVendorGrid vs. the complexity of
      a cache-invalidation strategy. The dev chose simplicity, with
      the explicit out that memoization is a "simple add" if
      profiling ever flags it.

  - decision: 'StackedAreaChart selectedVendor: String? = nil (default param)'
    verdict: JUSTIFIED (non-breaking cross-story modification)
    rationale: >-
      Story 4.4 explicitly flags this as Risk #3 — a cross-story
      modification that could break Story 4.3's callers. The default
      `= nil` parameter means existing call sites compile unchanged
      (StackedAreaChart(chartData:) still works); only Story 4.4's
      new call site passes selectedVendor explicitly. `visibleSamples`
      computed property keeps the filter logic localized to one
      place. The empty-state check switches from `chartData.isEmpty`
      to `visibleSamples.isEmpty` — correct because a single-vendor
      filter against a subset can produce empty even when chartData
      has samples.

  - decision: 'No hover annotation in MiniVendorChart'
    verdict: PARTIALLY ACCEPTED (DES-002 deferred to Wave 5)
    rationale: >-
      The story's AC-6 wording allows "simplified" but implicitly
      assumes some form of chartOverlay is present. The dev's choice
      to omit it entirely is defensible at the 260pt card scale —
      a hover tooltip would compete with the card's own click target
      and the line+axis is legible without an overlay. But strictly
      reading the AC, this is a partial deviation. Logged as
      DES-002 with explicit recommendation to revisit in Wave 5 if
      user feedback wants per-mark inspection.

smoke_ux_recommendation:
  policy: 'Code-level PASS; runtime smoke = Lorenzo bench (NOT gate-blocking)'
  rationale: >-
    Wave 2/3/4 precedent (Story 3.2 AC-5 / Story 3.3 AC-9 / Story 4.1
    SMK-001 / Story 4.2 SMK-002 / Story 4.3 SMK-003) batches the
    runtime UI smoke verification with the closing story of the
    Wave. For 4.4 the checklist Lorenzo will run against the .app
    when 4.6 lands:
      1. Open Main Window via ⌘1 — Aggregate StackedAreaChart visible
         (default mode).
      2. Switch ViewMode picker to "Per-vendor" — LazyVGrid of 5
         MiniVendorChart cards visible (3+2 or 2+2+1 layout
         depending on window width).
      3. Hover empty regions inside a card — entire card responds
         (tap target).
      4. Click a MiniVendorChart — colored border appears on the
         clicked card (selection highlight).
      5. Switch back to "Aggregate" — StackedAreaChart now shows
         only the selected vendor's area (selectedVendor filter
         applied).
      6. Click the same MiniVendorChart again — border clears,
         filter removed.
      7. Reduce Motion enabled in Accessibility prefs — mode toggle
         is instant (no fade).
    Code-level inspection confirms all 7 are correctly implemented;
    real-macOS validation batches with Wave 4 closing story.

