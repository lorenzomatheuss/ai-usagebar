  AC-5: >-
    PASS — Click in MiniVendorChart triggers `onTap?(vendorId)`
    (MiniVendorChart.swift lines 82-84) which propagates through
    `PerVendorGrid.onVendorSelected` (line 79) to
    `chartViewModel.selectVendor($0)` (MainWindowView.swift line 146).
    Selection border via `.overlay(RoundedRectangle(cornerRadius: 8)
