checks_detail:
  - name: code_review
    verdict: PASS
    notes: >-
      DateRangePicker.swift (188 LOC) is idiomatic SwiftUI: `enum
      DateRangeMode: String, CaseIterable, Identifiable` with `.days7`,
      `.days30`, `.custom` + a readable `label` computed property (lines
      25-39); `struct DateRange: Equatable` with `startDate`/`endDate`
      lets and `sinceTs`/`untilTs` computed as `Int64(date.timeIntervalSince1970
      * 1000)` (lines 43-50) — matches ADR-4 (Int64 ms) and is idempotent
      for a given Date, satisfying AC-6. Static factory `lastNDays(_:from:
      calendar:)` (lines 63-73) is parameterised by Calendar for testability
      — a thoughtful seam given XCTest will land in Wave 7. The View
      (lines 103-176) lays out `Picker("Period", selection: $mode)` with
      `.segmented` style + `.labelsHidden()` + `.frame(width: 220)` and a
      conditional `customRangeControls` block when `mode == .custom` — two
      `DatePicker(...selection: $pending...).datePickerStyle(.compact)
      .labelsHidden()` + arrow separator + `Button("Apply")
      .disabled(isCustomInvalid)` + caption error message — exactly as
      AC-1/AC-2 specify. `handleModeChange(_:)` (lines 156-168) writes
      .days7/.days30 ranges directly via the binding but only seeds
      pendingStart/pendingEnd on switch to .custom — Apply remains the
      sole commit path for custom (AC-2). `applyCustomRange()` (lines
      170-175) sets `startOfDay(for: pendingStart)` → `endOfDay(for:
      pendingEnd)` so the custom range follows the same endpoint
      convention as the 7d/30d factories. The `onValueChange`
      View-extension shim (lines 79-89) wraps the macOS 13 / macOS 14
      onChange API gap with `if #available(macOS 14.0, *)` — keeps the
      build warning-free and the future deployment-target bump a one-
      extension delete (textbook). `Calendar.endOfDay(for:)` (lines
      91-99) computes `startOfDay + 1 day - 1 second` via DateComponents
      — returns `23:59:59` of the target day in the local timezone.
      Force-unwraps in lastNDays + endOfDay are justified — Calendar
      arithmetic only fails on overflow (year ±10000) which finite-day
      offsets from `now` cannot trigger. MainWindowViewModel.swift (37
      LOC) is minimal and correct: `@MainActor final class
      MainWindowViewModel: ObservableObject` with `@Published var
      dateRange`, `init(initialRange: DateRange = .last7Days())` (DI
      seam preserved), and `applyRange(_:)` writing `dateRange = range`
      so external callers (chart click-to-zoom in 4.4) have a clean
      extension point without touching `@Published` plumbing. No FFI
      surface introduced — `import Combine; import Foundation` only.
      MainWindowView.swift diff (49 LOC, +34/-15) replaces the Story
      4.1 placeholder Text with `VStack(spacing: 0) { topBar; Divider;
      contentArea }`; `topBar` is `HStack { DateRangePicker(dateRange:
      $viewModel.dateRange); Spacer() }` with `padding(.horizontal, 16)`
      + `padding(.vertical, 10)`; `contentArea` keeps the "History —
      Wave 4" placeholder Text for now until Story 4.3 wires the chart.
      `@StateObject private var viewModel = MainWindowViewModel()`
      satisfies AC-4 and Risk row #4 (ownership documented in Dev Agent
      Record). No retain cycles — value-type DateRange + class
      ObservableObject with only @Published storage.

