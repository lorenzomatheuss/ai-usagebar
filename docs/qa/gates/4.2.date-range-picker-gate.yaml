  - name: security
    verdict: PASS
    notes: >-
      No new attack surface — no FFI calls in this story, no file I/O,
      no keychain access, no network. DateRange is a value type with
      no input from external sources beyond user-driven DatePicker
      selections (already sandboxed by AppKit's date validation). No
      secrets, API keys, or credentials touched. Custom-mode invalid
      range (end<start) is rejected at the UI layer per AC-2 — the
      binding write never propagates an inverted range to the
      ViewModel, so downstream consumers (Story 4.3 onward) cannot
      receive a since>until pair.

  - name: documentation
