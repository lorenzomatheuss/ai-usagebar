  - name: performance
    verdict: N/A
    notes: >-
      No NFR with numeric target applies to a synchronous SwiftUI
      segmented picker. @Published writes propagate via Combine in
      O(subscribers) — once Story 4.3 attaches a ChartViewModel
      subscriber, latency from picker change → chart re-render is
      dominated by the FFI call (Story 4.3's ffi_query_aggregated)
