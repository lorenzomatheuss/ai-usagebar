acs_verified: '6/7 (AC-7 deferred per Wave 7 backlog, acknowledged by @dev)'
acs_breakdown:
  AC-1: >-
    PASS — apple/Torven/MainWindow/DateRangePicker.swift lines 25-39 declare
    `enum DateRangeMode: String, CaseIterable, Identifiable` with cases
    `.days7`, `.days30`, `.custom` (`var id: String { rawValue }`); lines
    43-74 declare `struct DateRange: Equatable` with `startDate`/`endDate`
    + `sinceTs`/`untilTs` computed Int64 (ADR-4 ms-epoch surface) +
    `last7Days(from:calendar:)` / `last30Days(from:calendar:)` static
    factories (injectable Calendar for testability). View struct
    `DateRangePicker` (line 103) hosts `Picker("Period", selection:
    $mode)` with `.pickerStyle(.segmented)` + `.labelsHidden()` +
    `.frame(width: 220)` (lines 114-121). When `mode == .custom`,
    `customRangeControls` (lines 134-154) renders two `DatePicker(...,
    selection: $pendingStart/$pendingEnd, displayedComponents: .date)
    .datePickerStyle(.compact).labelsHidden()` plus an arrow separator
    + Apply button + invalid-range caption.

  AC-2: >-
    PASS — `@State private var pendingStart: Date = Date()` and
    `pendingEnd: Date = Date()` (lines 107-108) hold edit-time values
    locally before commit. `private var isCustomInvalid: Bool {
    pendingEnd < pendingStart }` (line 110) drives both the
    `.disabled(isCustomInvalid)` on the Apply button (line 147) and the
    conditional caption `Text("End date must be after start date")
    .font(.caption).foregroundColor(.red)` (lines 150-153). Apply is the
    sole binding-write path for custom mode — `applyCustomRange()` (lines
    170-175) materialises the committed range via `cal.startOfDay(for:
    pendingStart)` and `cal.endOfDay(for: pendingEnd)`, then assigns to
    `dateRange`. The picker never publishes intermediate DatePicker
    edits to `viewModel.dateRange`, satisfying "não recarregar live
    enquanto user edita datas".

  AC-3: >-
    PASS — apple/Torven/MainWindow/MainWindowViewModel.swift declares
    `@MainActor final class MainWindowViewModel: ObservableObject` (line
    25). `@Published var dateRange: DateRange` (line 26) is initialised
    via `init(initialRange: DateRange = .last7Days())` (lines 28-30) so
    default state is the last-7-days range as AC-3 requires. Method
    `applyRange(_ range: DateRange)` (lines 34-36) updates `dateRange`
    so external callers (chart click-to-zoom in Story 4.4, or programmatic
    range changes) have a clean entrypoint without touching the
    `@Published` machinery. NO FFI calls — only `import Combine; import
    Foundation`. ChartViewModel in Story 4.3 will observe `$dateRange`
    via Combine and own the `ffi_query_aggregated` call, per the
    layering decision documented in the story.

  AC-4: >-
    PASS — apple/Torven/MainWindow/MainWindowView.swift line 15
    `@StateObject private var viewModel = MainWindowViewModel()`;
    `var body: some View` (line 17) renders `VStack(spacing: 0) {
    topBar.padding(.horizontal, 16).padding(.vertical, 10); Divider();
    contentArea }`. `topBar` (lines 30-35) is `HStack(spacing: 12) {
    DateRangePicker(dateRange: $viewModel.dateRange); Spacer() }`.
    `contentArea` (lines 37-45) keeps `Text("History — Wave 4")` as a
    placeholder filling `maxWidth: .infinity, maxHeight: .infinity` —
    correct deferral: the chart swap is Story 4.3's responsibility, not
    4.2's, and keeping the placeholder visible until charts arrive is
    the right UX choice.

  AC-5: >-
    PASS — `MainWindowViewModel` default init uses `initialRange:
    DateRange = .last7Days()` (line 28), and `DateRangePicker.@State
    private var mode: DateRangeMode = .days7` (line 106) — so the
    segmented control opens with "7d" selected. `DateRange.last7Days()`
    delegates to `lastNDays(7, …)` which computes `startOfDay(today) -
    7 days` → `endOfDay(today)` via `Calendar` arithmetic — covers
    `[00:00 D-7, 23:59:59 D]` inclusively as AC-5 requires.

  AC-6: >-
    PASS — `DateRange.sinceTs: Int64 { Int64(startDate.timeIntervalSince1970
    * 1000) }` and `untilTs: Int64 { Int64(endDate.timeIntervalSince1970
    * 1000) }` (lines 49-50) compute Unix epoch in milliseconds as i64.
    Both are pure functions of the stored `startDate`/`endDate` — for a
    given `DateRange` value, repeated calls return identical Int64
    values (idempotent). The signature shape matches `ffi_query_aggregated`'s
    `since_ts: i64 (ms)` parameter from Story 4.0.5. AC-2 prevents
    `since>until` from being committed at the UI layer (Apply is
    disabled when `pendingEnd < pendingStart`), and `applyCustomRange()`
    materialises through `startOfDay` / `endOfDay` so the persisted
    range always satisfies `startDate <= endDate`. The FFI call itself
    is the responsibility of `ChartViewModel` in Story 4.3 per the
    layering decision.

  AC-7: >-
    DEFERRED — Snapshot tests for 7d/30d/Custom (valid+invalid) require
    an XCTest target which apple/project.yml currently lacks
    (`testTargets: []`). Wave 1 ADR §4 explicitly deferred Swift-side
    test infrastructure to Wave 7, with the calibration that
    SwiftUI #Preview + compile-time + runtime smoke covers this layer in
    the meantime. The story's #Preview block (lines 178-188) provides
    visual verification of the default 7d state during dev. The 30d
    / Custom states are visually verifiable via the same preview by
    interacting with the segmented control. This deferral matches
    Stories 2.1-2.3 (PASS aggregate 9.83) and 3.1-3.3 precedent and is
    gate-acceptable. Tracked as DBT-001 for Wave 7.

decisions_review:
  - decision: '@StateObject vs @ObservedObject for MainWindowViewModel ownership'
    verdict: JUSTIFIED
    rationale: >-
      MainWindowView is the single owner of the MainWindowViewModel
      instance for the lifetime of the NSWindow (Story 4.1's
      MainWindowController retains the NSHostingView indefinitely via
      windowShouldClose returning false + orderOut). @StateObject is the
      correct SwiftUI primitive for "this view owns this object and
      should keep it alive across re-renders" — @ObservedObject would
      risk premature deallocation if SwiftUI ever re-instantiated
      MainWindowView. Story 4.3+ ChartViewModel sub-views will receive
      the VM via `.environmentObject` or property injection, not via
      direct @StateObject reinstantiation. Dev Notes documents this
      explicitly and references Risk row #4. Pattern matches Apple's
      official guidance.

  - decision: 'onChange deprecation shim via private View extension'
    verdict: JUSTIFIED
    rationale: >-
      macOS 14 introduced `onChange(of:, _ : (oldValue, newValue) ->
      Void)` (two-arg) and deprecated the macOS 13 `onChange(of:,
      perform:)` (single-arg). With deployment target macOS 13.0 (per
      Wave 4 D5), only the single-arg form compiles cleanly on the
      minimum target — but the macOS 14+ build emits a deprecation
      warning. The `View.onValueChange(of:perform:)` extension picks
      the correct form via `if #available(macOS 14.0, *)` — keeps the
      build warning-free, makes the future macOS 14 deployment bump a
      one-extension delete, and avoids littering `#available` blocks
      at every onChange callsite. Localised abstraction with a
      well-defined retirement plan.

  - decision: 'Endpoint convention [startOfDay, endOfDay] for ranges'
    verdict: JUSTIFIED
    rationale: >-
      `last7Days()` covers `00:00 D-7 → 23:59:59 D` inclusively. This
      matches the calendar-day mental model users expect ("show me the
      last 7 days") and avoids fence-post bugs when day boundaries
      cross. Custom mode applies the same convention via
      `applyCustomRange()`. Computing endOfDay as `startOfDay + 1 day -
      1 second` is the textbook idiom — alternatives like
      `startOfDay(tomorrow) - 1 ns` are more precise but unnecessary
      for ms-resolution FFI surface. Calendar.endOfDay extension is
      private to the file (no public API leak).

  - decision: 'Timestamps in milliseconds (Int64) for FFI surface'
    verdict: JUSTIFIED
    rationale: >-
      Story 4.0.5 introduced `ffi_query_aggregated(since_ts: i64, …)`
      with explicit ms-epoch semantics. ADR-4 documents the FFI
      Int64-ms convention. `Int64(date.timeIntervalSince1970 * 1000)`
      converts Swift's Double seconds-since-epoch to Int64 ms — for a
      given Date, repeated calls return identical values (idempotent
      per AC-6). The Double→Int64 truncation drops sub-ms precision
      which is irrelevant for usage analytics aggregation (SQLite
      data is also stored at ms granularity per the schema).

  - decision: 'MainWindowViewModel as state-holder (no FFI calls in this story)'
    verdict: JUSTIFIED
    rationale: >-
      Wave 4 layering: 4.2 introduces the picker + state holder, 4.3+
      introduce ChartViewModels that observe `$dateRange` via Combine
      and own the FFI calls. This keeps 4.2's dependency surface
      minimal (no Story 4.0.5 dependency), the state holder trivially
      unit-testable in isolation (no FFI mocking required), and
      provides a clean Combine observation point that multiple future
      ChartViewModels can subscribe to without coupling. PO's fix F-1
      during Wave 4 validation specifically removed the FFI-call
      coupling that was originally proposed — current implementation
      correctly executes that decision.

  - decision: 'Injectable Calendar in last7Days/last30Days factories'
    verdict: JUSTIFIED (testability seam)
    rationale: >-
      `static func last7Days(from: Date = Date(), calendar: Calendar =
      .current)` lets the production callsite use `.current` while
      future tests can inject a frozen-clock Calendar with a specific
      timezone — important for snapshot/unit tests once Wave 7 stands
      up XCTest. Minimal cost (single parameter with default), high
      future utility. Not currently exercised because no test target
      exists, but the seam is correctly carved.

  - decision: 'Equatable conformance on DateRange'
    verdict: JUSTIFIED
    rationale: >-
      Enables `==` comparison in tests, change detection in
      Combine pipelines (e.g. ChartViewModel.$dateRange.removeDuplicates()),
      and SwiftUI diffing optimisations. Value-type struct with two
      stored Date properties — synthesized conformance is free. Idiomatic.

smoke_ux_recommendation:
  policy: 'Code-level PASS; runtime smoke = Lorenzo bench (NOT gate-blocking)'
  rationale: >-
    Wave 2/3/4 precedent (Story 3.2 AC-5 / Story 3.3 AC-9 / Story 4.1
    SMK-001) established that runtime UI smoke runs against Lorenzo's
    real macOS environment after QA gate, with textual confirmation in
    the closing story's Change Log being the audit-trail equivalent of
    screenshots. The four smoke checkpoints to verify outside this
    gate are:
      1. Open Main Window via ⌘1 or "Show History…" footer — 3-segment
         picker visible with "7d" selected by default
      2. Tap "30d" → segment switches, no DatePicker controls appear
      3. Tap "Custom" → two DatePicker.compact controls appear with
         arrow separator + Apply button
      4. In Custom, set end date < start date → Apply button greys
         out + red caption "End date must be after start date" surfaces;
         set valid range → Apply enables; tap Apply → range commits to
         the ViewModel (visually verifiable once chart wiring lands in
         4.3, otherwise inspect via debugger)
    Code-level inspection confirms the logic for all four is correct.
    Runtime verification can post-merge follow under the project's
    established cadence (batched with the closing story of the Wave 4
    chart sub-wave per session checkpoint convention).

