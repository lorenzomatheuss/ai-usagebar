status_reason: >-
  Wave 4 sub-wave 4.2 (Date Range Picker) delivers a clean, dependency-free
  SwiftUI segmented picker + MainWindowViewModel state-holder cleanly aligned
  with WAVE4-D3 (7d/30d/Custom + native DatePicker.compact, zero SPM
  additions) and ADR-4 (Int64-ms FFI surface for sinceTs/untilTs ready for
  Story 4.3's ffi_query_aggregated consumer). 6 of 7 ACs verified at code
  level; AC-7 (snapshot tests) explicitly deferred per dev — apple/project.yml
  testTargets is empty by Wave 1 ADR §4 decision (XCTest infra is Wave 7
  backlog), and SwiftUI #Preview blocks provide visual verification in the
  meantime — this is the same coverage envelope already accepted for Stories
  2.1-2.3 and 3.1-3.3. ViewModel is FFI-free as required (purely a state
  holder publishing $dateRange via Combine), which preserves the layering for
  4.3 to introduce ChartViewModel as the actual FFI caller without forcing
  4.2 to depend on 4.0.5. DateRange.last7Days/last30Days factories accept an
  injectable Calendar parameter — a quiet improvement that makes the value
  type trivially unit-testable once XCTest stands up. Endpoint convention is
  rigorous: startOfDay(D-N) → endOfDay(D) via Calendar arithmetic avoids
  fence-post bugs. Custom-mode invalid range (end<start) disables Apply and
  surfaces the red caption per AC-2 — Apply binding writes through only on
  user confirmation, never on intermediate DatePicker edits. The onChange
  deprecation shim (`onValueChange`) is a tidy macOS 13/14 compatibility
  abstraction that keeps the deployment target honest and the build warning-
  free. Build gate green per dev evidence (cargo test --workspace 173/173,
  xcodebuild Debug BUILD SUCCEEDED, xcodegen regenerated cleanly).
  CodeRabbit pre-review (--prompt-only -t uncommitted, macOS native) returned
  0 CRITICAL / 0 HIGH and 1 MINOR documentation/style finding on
  Calendar.endOfDay docstring — non-blocking, tracked as DOC-001. T6 smoke
  (3-segment picker visible + 7d default + custom DatePickers + Apply
  disable) deferred to Lorenzo's bench per project precedent (Story 3.2
  AC-5 / Story 3.3 AC-9 / Story 4.1 SMK-001 calibration). Score 9.3 vs 10
  reflects (1) AC-7 snapshot-test deferral acknowledged in Wave 7 backlog,
  (2) DOC-001 minor docstring nit, (3) tracked one-way mode↔dateRange sync
  observation (DES-001) for future click-to-zoom interactions in Story 4.4.

