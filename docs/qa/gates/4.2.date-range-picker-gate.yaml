issues:
  - id: DOC-001
    severity: low
    category: documentation
    description: >-
      `Calendar.endOfDay(for:)` extension docstring (DateRangePicker.swift
      line 92) says `23:59:59.999` but the implementation uses
      `comps.second = -1` which yields `23:59:59` (no sub-second
      fraction). Cosmetic mismatch — the inclusive endpoint behavior
      is correct (any timestamp on the target day is captured by the
      [startOfDay, endOfDay] range, since ms-resolution data points
      land within the second-granularity envelope), only the docstring
      precision is overstated.
    suggested_action: >-
      Tiny one-line fix — change the docstring to `23:59:59` or update
      the implementation to set `nanosecond = 999_999_000` for true
      `23:59:59.999` precision. Either resolution is acceptable. Can
      be batched with the Story 4.3 PR or applied as a touch-up on
      this story's PR.

  - id: DES-001
    severity: low
    category: code
    description: >-
      `DateRangePicker.@State private var mode: DateRangeMode = .days7`
      is local to the view and tracks the segmented selection. When
      `dateRange` is mutated externally (e.g., Story 4.4's chart
      click-to-zoom calling `viewModel.applyRange(arbitraryRange)`),
      the segmented `mode` will NOT update to `.custom` automatically —
      so the user would see "7d" highlighted while an arbitrary range
      is active. Not a current AC violation (no external mutation
      path exists in 4.2) but worth surfacing as Wave 4.4 lands click-
      to-zoom.
    suggested_action: >-
      Defer to Story 4.4 (chart click-to-zoom). At that point, derive
      `mode` from `dateRange` (e.g., compare to .last7Days() /
      .last30Days() with a tolerance, default to .custom otherwise)
      OR have applyRange notify the picker explicitly via a separate
      Combine pipeline. Not blocking for this gate.

  - id: SMK-002
    severity: low
    category: testing
    description: >-
      Runtime smoke for the 3-segment picker (7d default, 30d switch,
