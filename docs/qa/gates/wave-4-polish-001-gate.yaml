  Y-axis + hover card + MiniVendorChart header total (4th file
  discovered via grep — proper scope expansion). LAY-001 reduced
  DateRangePicker Picker frame 220→180pt with 5-line inline
  rationale documenting why and the math. Build gates all green:
  `cargo test -p torven-core` includes the new test passing (5 tests
  in `uniffi_exports::tests` module — build_status_normalizes_negative_zero
  + 4 pre-existing 4.6 tests); `cargo clippy -D warnings` clean;
  `cargo fmt --check` clean; `xcodebuild Debug BUILD SUCCEEDED`
  independently re-verified at gate time on branch HEAD 16492fd.
  CodeRabbit `--prompt-only -t uncommitted` (dev pre-commit run) →
  0 findings on the 4 changed files, 1 MINOR finding on untracked
  `docs/cases-drafts/personal/torven-local-first-llm-usage-tracker.md`
  (unrelated). Score 9.4 vs 10 reflects (1) BUG-001 was not
  empirically reproduced before fix (aiox-qa couldn't trigger the
  -0.0 path with current data — fix is defensive against IEEE 754
  semantics, not against a confirmed code path), (2) LAY-001 fix
  is dimension-tuned at 900pt default window; users running narrow
  windows may still see overflow (acknowledged as Wave 5 if it
  resurfaces).

