fixes_applied:
  - id: BUG-001
    title: 'BudgetBurn label shows "-US$ 0,00" instead of "US$ 0,00"'
    severity: low (cosmetic, "polished demo killer" per portfolio context)
    cause: 'signed-zero (-0.0) propagation through HashMap::values().sum::<f64>() rendered as "-US$ 0,00" by Swift pt-BR NumberFormatter'
    fix_site: 'crates/torven-core/src/uniffi_exports.rs:846, 852, 859, 866 — defensive `+ 0.0` in 3 propagation sites (the IEEE 754 idiom for "collapse -0.0 to +0.0 without affecting any other value")'
    test: 'build_status_normalizes_negative_zero — uses `to_bits()` bitwise comparison; asserts all 4 fields (total_spent_usd, total_percent_used, per_vendor[0].spent_usd, per_vendor[0].percent_used)'

  - id: FMT-001
    title: 'IntegerFormatStyle<Int>() without thousand separators on Requests Y-axis + hover card'
    severity: low (carry-forward from Story 4.5 gate)
    cause: 'Story 4.5 chose `IntegerFormatStyle<Int>()` without `.grouping(.automatic)` — request counts ≥1000 render cramped without locale-aware separators ("1234" instead of "1.234" pt-BR / "1,234" en-US)'
    fix_site: 'apple/Torven/MainWindow/Charts/StackedAreaChart.swift (Y-axis Requests format + hover card) + apple/Torven/MainWindow/Charts/MiniVendorChart.swift (header total) — `.grouping(.automatic)` applied consistently'
    test: 'visual via #Preview blocks; no XCTest target available'

  - id: LAY-001
    title: 'Apply button truncated when DateRangePicker Custom mode active'
    severity: low (UX, only visible at default 900pt window with Custom mode)
    cause: 'Story 4.5 tightened ViewMode Picker 220→180pt but missed DateRangePicker segmented Picker (still 220pt). Top-bar layout total: 220 (DRP picker) + ~100 (DatePicker start) + 15 (→) + ~100 (DatePicker end) + 60 (Apply) + 180 (ViewMode) + 160 (ChartMetric) + 4×spacing = ~870pt, overflowing the 868pt available (window 900pt - 32pt padding). Apply button pushed out of bounds.'
    fix_site: 'apple/Torven/MainWindow/DateRangePicker.swift:121 — `.frame(width: 180)` (was 220). Frees ~40pt headroom. Inline rationale comment documents the math + the consistency with ViewMode Picker width.'
    test: 'visual smoke — Lorenzo bench (deferred per project precedent)'

