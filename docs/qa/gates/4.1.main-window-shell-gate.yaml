status_reason: >-
  Wave 4 sub-wave Shell opener delivers the NSWindowController singleton
  + dual-invocation pattern (PopoverView footer button + ⌘1 global hotkey
  via KeyboardShortcuts SPM 2.4.0) cleanly. All 10 ACs verified at code
  level. Singleton pattern is textbook (private init, static let shared,
  NSWindowDelegate conformance, windowShouldClose → orderOut(nil) + return
  false, isReleasedWhenClosed=false belt-and-suspenders, NSHostingView
  wrapping placeholder MainWindowView). Hotkey registration is forward-
  defensive: configureGlobalHotkeys() applies the ⌘1 default only when
  TorvenMainWindowDefaultShortcutApplied UserDefault is absent, so a
  future Settings recorder (Wave 5+) will not be overwritten on relaunch.
  NSApp.activate(ignoringOtherApps: true) before makeKeyAndOrderFront(nil)
  is exactly the LSUIElement contract for bringing a window to focus from
  background. Reduce Motion satisfied naturally — show() uses only native
  AppKit paths without custom animation, so accessibilityDisplayShouldReduceMotion
  is honored by the system. Wave 3 popover regression check passes:
  ForEach(coreBridge.vendors) rendering and frame(width: 380, height: 540)
  are untouched; the new HStack footer sits below Spacer(minLength: 0)
  consuming roughly 28-32pt — fits within the 540pt envelope but tight
  enough to warrant the visual confirmation captured in issue VIS-001.
  Build gate green per dev evidence (cargo test --workspace 29/29 with
  Rust untouched in this story, xcodebuild BUILD SUCCEEDED with
  KeyboardShortcuts 2.4.0 SPM resolved, xcodegen regenerated cleanly).
  Score 9.5 vs 10 reflects (1) runtime smoke deferred to Lorenzo's bench
  for the Accessibility permission prompt + ⌘W hide + ⌘1 background flow
  (same calibration as Story 3.2 AC-5 / Story 3.3 AC-9), and (2) the
  tight-but-acceptable popover footer fit noted as a low-severity visual
  follow-up.

