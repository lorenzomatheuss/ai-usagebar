issues:
  - id: VIS-001
    severity: low
    category: code
    description: >-
      PopoverView footer (Show History… button + 16pt vertical padding)
      consumes approximately 28-32pt inside the fixed 380×540 popover
      frame. With Wave 3 having 5 vendor cards + header occupying
      ~484pt and the previous Spacer(minLength: 0) absorbing ~56pt,
      the new residual margin is ~24pt. Mathematically the cards still
      fit, but the cushion is tight enough that any future card
      height bump (e.g. multi-line error states from Wave 7 AR-8)
      could push the last card into clipped territory.
    suggested_action: >-
      Accept for now. When Wave 7 AR-8 introduces dynamic card content
      (active-account label, error states), revisit the popover frame
      height (consider 380×580 or making it intrinsic via removing
      .frame(height: 540) and letting SwiftUI size the popover). Track
      as Wave 7 follow-up.

  - id: SMK-001
    severity: low
    category: testing
    description: >-
      Runtime smoke for Accessibility permission prompt, ⌘W hide
      behavior, ⌘1 background activation, and visual idempotency is
      deferred to Lorenzo's bench (project pattern, matches Story 3.2
      AC-5 / Story 3.3 AC-9 calibration). Code-level inspection
      confirms the logic for all four is correct, but real-macOS
      validation has not yet been recorded textually.
    suggested_action: >-
      After @devops *push, run the .app from DerivedData (or built
      bundle) and append a 4-line smoke confirmation to the Story
      4.1 Change Log: (1) prompt seen + permission granted, (2) ⌘W
      hides without window count increasing, (3) ⌘1 brings window
      to front from another app's focus, (4) repeated button clicks
      show same window. Equivalent to the textual-audit-trail
      pattern already used in Wave 3.

  - id: ARC-001
    severity: low
    category: architecture
    description: >-
      Hotkey wiring lives in TorvenApp.init() via a static method.
      Once Story 1.15 adds the @NSApplicationDelegateAdaptor for the
      Keychain-shutdown wiring (per ADR-10), configureGlobalHotkeys()
      will logically migrate into applicationDidFinishLaunching for
      consistency with other lifecycle-bound setup.
    suggested_action: >-
      Defer to Story 1.15. No action needed in Wave 4. Header comment
      in TorvenApp.swift already flags this migration path.

