checks_detail:
  - name: code_review
    verdict: PASS
    notes: >-
      MainWindowController.swift (70 LOC) is idiomatic AppKit: final
      class : NSWindowController, NSWindowDelegate, private init() with
      static let shared, NSWindow constructed with the exact styleMask
      [.titled, .closable, .miniaturizable, .resizable], backing:
      .buffered, defer: false, title "Torven — History", initial frame
      NSRect 0,0,900,600 centered after init via window.center(),
      setFrameAutosaveName("TorvenMainWindow") for system-managed
      position/size persistence, contentView wraps NSHostingView(rootView:
      MainWindowView()), isReleasedWhenClosed = false. show() activates
      with ignoringOtherApps: true (LSUIElement contract), calls
      showWindow(nil) then makeKeyAndOrderFront(nil) — idempotent because
      AppKit no-ops on already-keyed windows. windowShouldClose returns
      false and calls orderOut(nil) so the singleton retains its
      NSWindow and SwiftUI host between open/close cycles. required
      init?(coder:) is marked @available(*, unavailable) with a fatalError
      stub, the correct pattern for code-only NSWindowControllers.
      MainWindowView.swift is a 32-LOC placeholder Text("History — Wave 4")
      with .font(.title2).foregroundStyle(.secondary).frame(maxWidth:
      .infinity, maxHeight: .infinity) + #Preview at 900×600 — minimal
      surface area, no @EnvironmentObject so SwiftUI previews compile
      without bridge mocks (matches the story's risk-table mitigation).
      TorvenApp.swift adds import KeyboardShortcuts, the
      extension KeyboardShortcuts.Name.openMainWindow = Self("openMainWindow")
      contract, and a private static configureGlobalHotkeys() called
      from init(). The function is read-once-then-handler: guards on
      TorvenMainWindowDefaultShortcutApplied (UserDefaults), applies the
      ⌘1 default exactly once, then registers
      KeyboardShortcuts.onKeyUp(for: .openMainWindow) {
      MainWindowController.shared.show() }. PopoverView footer is
      composed minimally: HStack { Spacer(); Button("Show History…") {
      MainWindowController.shared.show() }.buttonStyle(.plain)
      .font(.footnote).foregroundColor(.secondary); Spacer() }
      .padding(.vertical, 8) — sits below Spacer(minLength: 0) within
      the existing .frame(width: 380, height: 540). No retain cycles
      possible (singleton holds NSWindow, NSWindow holds delegate via
      weak reference per AppKit contract).

