decisions_review:
  - decision: 'init() vs @NSApplicationDelegateAdaptor for hotkey wiring'
    verdict: JUSTIFIED
    rationale: >-
      KeyboardShortcuts manages its own CGEventTap lifecycle, so it
      does not require AppDelegate hooks for setup or teardown.
      Wiring configureGlobalHotkeys() from TorvenApp.init() is
      sufficient at this stage. The future migration to
      @NSApplicationDelegateAdaptor (planned in Story 1.15 for the
      Keychain-shutdown flow per ADR-10) is documented in the
      TorvenApp.swift header comment. No risk introduced by the
      current choice — the handler is a single registration call
      that survives app lifecycle.

  - decision: 'UserDefaults default-once guard for ⌘1'
    verdict: JUSTIFIED (forward-defensive)
    rationale: >-
      KeyboardShortcuts persists user-modified shortcuts via its own
      internal UserDefaults keys. If configureGlobalHotkeys() applied
      the default ⌘1 on every launch, it would silently overwrite a
      user-recorded choice the moment Wave 5+ adds the Settings
      shortcut recorder. The TorvenMainWindowDefaultShortcutApplied
      flag scopes the default exclusively to first launch. Exact
      pattern recommended by KeyboardShortcuts' own README.

  - decision: 'isReleasedWhenClosed = false explicit set'
    verdict: JUSTIFIED (defensive)
    rationale: >-
      NSWindows created programmatically (via NSWindow init) have
      isReleasedWhenClosed defaulting to true historically. Combined
      with windowShouldClose returning false + orderOut, the explicit
      = false is belt-and-suspenders against any AppKit code path
      that might still trigger the release. Minimal cost (single
      line), high defense for the singleton invariant.

  - decision: 'HStack footer (Spacer + Button + Spacer) for centering'
    verdict: JUSTIFIED
    rationale: >-
      Centers the Button("Show History…") horizontally within the 380pt
      popover width. Alternative would be Button(...).frame(maxWidth:
      .infinity) — equivalent visually, slightly less explicit about
      intent. Current HStack-Spacer-Button-Spacer is idiomatic SwiftUI
      for "center a single child". Not gate-blocking. Could be reduced
      to a single Spacer modifier in a future refactor if the footer
      grows to include left/right elements.

