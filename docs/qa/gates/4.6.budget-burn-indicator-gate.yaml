decisions_review:
  - decision: 'Separate budgets.rs module (not bolted onto config.rs)'
    verdict: JUSTIFIED
    rationale: >-
      config.rs is already 1300+ LOC with multi-account schema, env
      resolution, and active-account persistence. Bolting `[budgets]`
      onto that file would muddy the existing concerns. Budget
      surface is narrower (single-section read, no migration history,
      no save path in Wave 4 — Wave 5 adds Settings UI). A dedicated
      module keeps the surface obvious. Documented in the file
      header.

  - decision: 'Inline SQL aggregate_month_spend (not query_aggregated reuse)'
    verdict: JUSTIFIED
    rationale: >-
      `ffi_query_aggregated` returns temporal buckets (hourly/daily/
      weekly) — overkill for "sum the entire month per vendor".
      Inline `SELECT vendor, SUM(cost_usd) FROM usage_snapshots
      WHERE ts >= ? AND ts < ? GROUP BY vendor` is direct, uses the
      same ts index, no Strategy enum complexity. The story doc
      explicitly offered both paths ("OU executar query SQL inline
      se mais simples"); the dev's choice is the simpler one.

  - decision: 'month_start_utc_ms_at(now) extracted for testability'
    verdict: JUSTIFIED (model worth replicating)
    rationale: >-
      Without this split, `month_start_utc_ms()` would internally
      call `Utc::now()` and tests couldn't pin a reference instant
      without monkey-patching chrono. The pattern (pure helper takes
      `now: DateTime<Utc>`, production calls Utc::now() and forwards)
      is the dependency-injection idiom for time-sensitive logic.
      Wave 5 should consider this pattern for any other time-driven
      code.

  - decision: 'Gauge .accessoryLinear with ProgressView fallback (macOS 14+ guard)'
    verdict: JUSTIFIED (belt-and-suspenders)
    rationale: >-
      `Gauge` was introduced in macOS 12 and `.accessoryLinear`
      requires macOS 13 — which IS our deployment target. But the
      dev wrapped in `if #available(macOS 14, *)` with ProgressView
      fallback anyway. Rationale (BudgetBurn.swift lines 29-42): (1)
      a future Xcode SDK could raise the Gauge requirement (has
      happened twice across watchOS/iOS); (2) ProgressView has more
      predictable .tint() behavior on 13 (Gauge .accessoryLinear on
      13.0 has reported edge cases with custom tints). Defensive
      design that costs ~6 LOC and survives SDK churn.

  - decision: 'BudgetStatus::empty() on every error (no [Throws=...] in UDL)'
    verdict: JUSTIFIED
    rationale: >-
      Marking `get_budget_status` as `[Throws=...]` would force the
      Swift caller (ChartViewModel.reload) into a do/catch ladder
      for what is fundamentally a "show or hide the gauge" decision.
      The graceful-empty approach (Rust-side `tracing::warn!` for
      diagnostics + return `BudgetStatus::empty()`) is simpler at
      the call site and more user-friendly (no error popups for a
      non-essential gauge). The UDL declaration matches this
      contract verbatim.

  - decision: 'NaN/Infinity handling in burnColor (defensive Swift-side branches)'
    verdict: JUSTIFIED
    rationale: >-
      NaN → green: AggregatedSample.fromFFI could conceivably produce
      a NaN if cost_usd is NaN in the source data (unlikely but
      defensible — SQLite REAL allows NaN). Treating NaN as "no
      budget set" green is the safest no-data-yet default.
      Infinity → red: zero-budget overspend (`100 / 0`) produces
      Infinity in Swift's Double math. Treating Infinity as red
      makes the gauge correctly screams "you're over budget by an
      undefined amount". `clampedToUnitPercentage()` extension
      filters NaN to 0 before the Gauge's [0, 100] range so the
      bar doesn't render an invalid value.

  - decision: 'per_vendor alphabetically sorted by vendor_id'
    verdict: JUSTIFIED (UI stability)
    rationale: >-
      HashMap iteration order in Rust is unspec. Without an explicit
      sort, the UI's per_vendor breakdown (when Wave 5 exposes it)
      could shuffle on every refresh. Alphabetical sort by
      vendor_id is deterministic and matches the Wave 4 convention
      established in Story 4.3's `ChartData.vendors` sort.

  - decision: 'Footer Divider gated on hasBudget too (not just BudgetBurn)'
    verdict: JUSTIFIED (UX polish)
    rationale: >-
      If only `BudgetBurn` is gated, an orphan `Divider()` would
      remain at the bottom of ChartContent for users without
      `[budgets]` configured — a visual hairline with nothing
      below it. Conditional `Divider()` + `BudgetBurn()` together
