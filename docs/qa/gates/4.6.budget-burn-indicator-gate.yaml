status_reason: >-
  Story 4.6 closes Wave 4 with the strongest implementation of the
  series. The story carried the highest risk profile — touches Rust
  core + UDL surface + UniFFI Swift regen + SwiftUI Gauge + month-
  to-date SQLite aggregation — and every risk flagged in the story
  doc was addressed with documented design rationale. **All 10 ACs
  verified at code level** — the only story in Wave 4 to achieve
  100% AC completion (vs 4.2's 6/7, 4.3's 9/10, 4.4's 8/9). Test
  coverage is exceptional: dev shipped 7 Rust tests (3 beyond the
  AC-8 required 4) covering full/absent/negative/monthly-reset PLUS
  zero-budget-accepted, empty-string, missing-file edge cases. The
  `month_start_utc_ms_at(now: DateTime<Utc>)` pure-helper extraction
  pattern (per Risk #1 mitigation) makes UTC month-boundary
  arithmetic trivially testable without monkey-patching
  `chrono::Utc::now()` — a clean dependency-injection idiom that
  Wave 5 can replicate for additional time-sensitive logic. The
  UDL surface extension correctly avoids the HashMap-direct
  exposure (Risk #4): `sequence<VendorBudgetStatus>` of records,
  same pattern as `sequence<VendorInfo>` (Story 1.5) and
  `sequence<TimeBucket>` (Story 4.0.5) — established Wave 1/4
  convention preserved. The Gauge / ProgressView macOS 13 fallback
  (Risk #2) is belt-and-suspenders — `if #available(macOS 14.0, *)`
  with ProgressView fallback even though the deployment target IS
  13.0 and Gauge .accessoryLinear technically works there. The dev's
  inline doc explains: future Xcode SDK could raise the Gauge
  requirement (happened twice across watchOS/iOS), and ProgressView
  has more predictable tinting on 13. Layout decision (AC-6) lives
  in the rodapé of ChartContent below the chart body + error band,
  with `Divider()` ALSO gated on `hasBudget` so users without
  `[budgets]` configured don't see an orphan divider line at the
  window's bottom edge — a small UX polish that costs nothing.
  Error semantics chosen exceptionally well: `get_budget_status` is
  NOT marked `[Throws=…]` in the UDL — every failure (config parse,
  SQLite I/O, FFI uninitialised) degrades server-side to
  `BudgetStatus::empty()` with `tracing::warn!` for diagnostics;
  Swift renders `EmptyView()` so users see no error popup (the
  gauge simply disappears). NaN / Infinity handling in `burnColor`
  is defensive: NaN → green (no budget set), Infinity → red (zero-
  budget overspend), with `clampedToUnitPercentage` filtering NaN
  to 0 before the gauge's [0,100] range. Per-vendor sort is
  alphabetical by vendor_id (HashMap iteration is unspec) so the
  UI doesn't shuffle on each refresh. Build gate matrix all green:
  `cargo test --workspace` all passing (4 new budgets.rs tests +
  existing) · `cargo clippy --workspace --all-targets -- -D
  warnings` clean (1 `unnecessary_cast` fixed during dev run) ·
  `cargo fmt --all -- --check` clean · `make build-core` ✓ ·
  `xcodebuild Debug BUILD SUCCEEDED` independently re-verified at
  gate time on branch HEAD e47dd46. **CodeRabbit pre-review
  rate-limit cleared** at gate time — `--prompt-only -t committed
  --base main` returned **No findings** ✔ (third "clean CR" of the
  Wave, matches Stories 4.2 and 4.3). REL-001 carried from
  Stories 4.4 + 4.5 is effectively resolved by this clean run.
  Score 9.6 vs 10 reflects (1) Risk #1 timezone UTC limitation
  (acknowledged in AC-7 + docstring, Wave 5 may add timezone
  pref — TZN-001), (2) SMK-006 runtime smoke deferral to Lorenzo
  bench (per project precedent), (3) Wave 4 closing smoke batch
  (SMK-001 → SMK-006) recommended as a single textual-audit-trail
  appendix to this story's Change Log post-bench.

