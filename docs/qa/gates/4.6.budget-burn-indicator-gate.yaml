issues:
  - id: TZN-001
    severity: low
    category: code
    description: >-
      Month-to-date aggregation uses UTC month-start (`Utc.with_ymd_and_hms
      (year, month, 1, 0, 0, 0)`) — users in non-UTC timezones will
      observe up to a 24-hour discrepancy between the wall-clock
      first-of-month and the gauge's reset. AC-7 explicitly
      documents this choice; the docstring on `month_start_utc_ms`
      flags it as a known limitation. Affects users with significant
      late-night/early-morning usage at month boundaries.
    suggested_action: >-
      Defer to Wave 5. When Settings UI lands (per Decision
      WAVE4-D6), add a `timezone_preference` field that defaults
      to UTC but accepts a chrono::FixedOffset or chrono_tz::Tz.
      `month_start_utc_ms_at(now)` already takes the reference
      instant as a parameter, so adding a timezone-shifted variant
      `month_start_local_ms_at(now, tz)` is purely additive.

  - id: SMK-006
    severity: low
    category: testing
    description: >-
      Runtime smoke (real config.toml with [budgets] section → gauge
      visible + color correct; config without [budgets] → gauge
      hidden; gauge updates on chart reload; threshold transitions
      at 80/100%; macOS 13 ProgressView fallback path on actual 13
      hardware if accessible) deferred to Lorenzo bench. Per
      project precedent and Wave 4 cadence — batched with
      SMK-001 through SMK-005 as a single comprehensive Wave 4
      end-to-end smoke audit.
    suggested_action: >-
      After Wave 4 close + the comprehensive smoke pass, append a
      textual smoke confirmation block to Story 4.6's Change Log
      covering all 6 SMK-* checkpoints. Same audit-trail pattern
      as Stories 3.2/3.3/4.1/4.2.

