issues:
  - severity: low
    category: tests
    description: >-
      All 10 integration tests use `metric_kind = "usd_spent"`. The
      `metric_kind` heterogeneity defense (included in all three
      GROUP BY branches) is therefore implemented correctly but
      not exercised by an end-to-end test. A future test with two
      events at the same bucket_start + vendor but with
      `metric_kind = "usd_spent"` vs `metric_kind = "tokens_used"`
      would assert the contract directly (expect 2 separate
      `TimeBucket` rows, not 1 silently-merged row).
    recommendation: >-
      Add as a low-priority follow-up test in Wave 6 when the
      evals binary populates synthetic events with mixed
      `metric_kind`. Not a blocker for this story — the
      implementation is correct by inspection and the existing
      `metric_kind` assertions in AC-7 / AC-10 verify
      preservation in the no-mix case.
  - severity: low
    category: performance
    description: >-
      AC-11 bench skipped. The numerical NFR-1 baseline for the
      Swift Charts performance budget is not recorded as part of
      this story.
    recommendation: >-
      Accept per the AC-11 opt-out flag. The Wave 6 evals binary
      (already on the roadmap and consuming `ffi_query_aggregated`
      as primary surface) is the correct venue for the baseline
      measurement — it has the synthetic fixtures (10K / 43K
      events) and the apples-to-apples alternative path
      (`ffi_query_snapshots` + Swift-side aggregation) needed for
      a meaningful comparison.

risks_followup:
  - risk_id: metric_kind_heterogeneity
    severity: low_after_mitigation
    mitigation: "Included in GROUP BY across All / Null / Specific branches; verified by code review."
    followup: "Add integration test for mixed metric_kind in Wave 6 evals work."
  - risk_id: i64_to_u64_cast_safety
    severity: low_after_mitigation
    mitigation: "`tokens_sum_i64.max(0) as u64` clamps; `request_count_i64.clamp(0, u32::MAX) as u32` clamps. Production rows are non-negative via `COALESCE(tokens_used, 0)`, but defense-in-depth is in place."
    followup: "None."
  - risk_id: bucket_alignment_utc
    severity: low
    mitigation: "Bucket boundary uses integer division of Unix ms — implicit UTC, consistent with `query_snapshots_paged`."
    followup: "Wave 5 polish can revisit local-time buckets if user feedback requests it. Documented in story Risks."

advisory_recommendations:
  - "Consider exposing `bucket_size_ms` as `pub` (already is) for the Swift Charts ViewModel to label x-axis ticks consistently — observed during code review that the Swift side will need this constant for `bucket_end_ts` reconstruction."
  - "The `vendor = \"\"` convention for \"all vendors\" is sound but worth documenting in the public `query_aggregated` docstring (it's covered in the UDL doc but not in the Rust doc) — small follow-up."

decision: PASS
