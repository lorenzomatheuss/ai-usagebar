status_reason: >-
  Story 4.0.5 lands the temporal-bucket aggregation FFI cleanly. UDL gains
  `dictionary TimeBucket`, `enum BucketStrategy`, and the
  `[Throws=HistoryFfiError] sequence<TimeBucket> ffi_query_aggregated(...)`
  declaration in `namespace torven_core` matching AC-1/AC-2/AC-3 verbatim
  (modulo UDL syntactic trailing commas, which are no-ops). Rust side
  exposes `history::query_aggregated` as a free function in
  `crates/torven-core/src/history/mod.rs` (positionally consistent with
  `query_snapshots_paged` / `record_snapshot` / `run_retention_janitor` —
  intentional deviation from the T2 spec text and documented in the Dev
  Agent Record). The FFI mirror in `uniffi_exports.rs` reuses the
  established `with_history_db(...)` helper and maps `HistoryError ->
  HistoryFfiError` through the existing `From` impl; `lib.rs` re-exports
  `BucketStrategy`, `TimeBucket`, and `ffi_query_aggregated` so UniFFI
  UDL-mode scaffolding resolves them at `crate::*`. The
  `bucket_size_ms(strategy, since, until)` helper implements `Auto` as
  documented: `≤ 7d → Hourly`, `≤ 30d → Daily`, `> 30d → Weekly`. Two
  deviations from the AC-4 verbatim SQL are documented and improve
  correctness: (1) real table name `usage_snapshots` instead of the spec's
  `history` placeholder, (2) per-`AccountFilter` SQL branching instead of
  a single CASE-WHEN with a sentinel string — the latter would emit one
  row per real `account_id` under `All` mode, all projected to NULL,
  violating the AC-10 "merge across accounts" contract; the branched
  shape mirrors the established `query_snapshots_paged` pattern. The
  `account_id` semantics in `AccountFilter::All` and `AccountFilter::Null`
  collapse to `account_id IS NULL` in the output, which is consistent
  with the AC-5 contract ("None quando AggregateAcrossAccounts ou All").
  Defense-in-depth on the `u64 tokens_sum` and `u32 request_count` casts
  (`i64::max(0) as u64` and `clamp(0, u32::MAX)`) protects against the
  documented `i64` SUM corner cases. 10 new integration tests in
  `crates/torven-core/tests/history_aggregated.rs` cover AC-7 / AC-8 /
  AC-9 ×3 / AC-10 ×4 / AC-5 empty-range; all pass. Full suite: 206
  pass / 0 fail / 9 ignored (zero regression from Wave 3 baseline). Score
  9.7 vs 10 reflects two minor non-blockers documented under `issues`:
  (1) heterogeneous `metric_kind` defense is correctly implemented in the
  GROUP BY but not exercised by an integration test (all 10 tests use
  `metric_kind = "usd_spent"`); (2) AC-11 bench was opt-out and the
  baseline measurement is correctly deferred to the Wave 6 evals binary
  which already consumes `ffi_query_aggregated` as its primary surface.

