machete_mitigation:
  applied_by: '@aiox-master (Orion)'
  commit: b3addf1
  ignored_deps_total: 15
  breakdown:
    torven-core: 13   # tokio, reqwest, serde, serde_json, toml, toml_edit, clap, chrono, fs2, tempfile, directories, thiserror, base64
    torven-tui: 2     # ratatui, crossterm
  decision: accepted-with-concerns
  rationale: |
    Mitigation is honest debt declaration: each ignored entry has inline comment pointing to the
    story that will consume the dep (1.4 extract-core, 1.6 config-migration, 1.13 history-sqlite,
    1.15 ai-insights-core, 1.16 doctor CLI, 1.20 keychain). Alternative approaches considered and rejected:
      - continue-on-error on machete step: hides real future debt, opaque
      - removing deps now: breaks Story 1.1 ADR contract (declared stubs for Wave 1 reuse)
      - skipping machete gate entirely: violates CLAUDE.md release checklist ("no unused deps")
    Accepting as CONCERNS (not PASS) to ensure the cleanup is tracked, not forgotten.
  follow_up: |
    Each downstream Wave 1 story (1.4, 1.6, 1.13, 1.15, 1.16, 1.20) MUST add to its DoD checklist:
      "[ ] Remove consumed dependency from crates/{crate}/Cargo.toml [package.metadata.cargo-machete] ignored list"
    QA gate on each of those stories MUST verify the corresponding entries were dropped from ignored.
    Tracking: Wave 1 close-out (after Story 1.20 lands) — `cargo machete` should require zero ignored entries.

