    verdict: PASS
    notes: '9/10 ACs verified at code level; AC-9 deferred per Wave 7 XCTest backlog (see acs_breakdown).'

  - name: no_regressions
    verdict: PASS
    notes: >-
      Story 4.2 contract preserved: `MainWindowView.swift` keeps
      `@StateObject viewModel = MainWindowViewModel()` and the
      DateRangePicker(dateRange: $viewModel.dateRange) in topBar. The
      private `ChartContent` sub-view receives `mainViewModel: viewModel`
      as `@ObservedObject` — proper SwiftUI ownership semantics, no
      double-storage. No changes to `DateRangePicker.swift`,
      `MainWindowViewModel.swift`, `MainWindowController.swift`, or any
      Wave 3 popover files. No changes to `crates/torven-core/*`. Build
      gate: `cargo test --workspace` 242/242 (was 173/173 in Story 4.2;
      69 additional tests come from 4.0.5's ffi_query_aggregated coverage
      which landed in main before 4.3 branched). `xcodebuild Debug
      BUILD SUCCEEDED` independently re-verified at gate time on
      branch HEAD 9ef0138. SourceKit diagnostic noise (Cannot find type
      X in scope) flagged at one point during file editing was IDE index
      staleness pre-xcodegen regeneration — does NOT reproduce against
      `xcodebuild` proper. Pre-existing linker warnings about macOS 26.5
      SDK vs 13.0 deployment target are inherited from main (not a 4.3
      regression).

  - name: performance
    verdict: PASS (with HOV-002 observation)
    notes: >-
      AC-8 NFR: render < 100ms for 30d × 5 vendors (150 marks). The 840-
      sample preview (7d × 5 vendors × 24 hourly buckets = the story's
      stated worst-case) renders cleanly at preview time on Apple Silicon
      per dev D-6 inspection. `.chartPlotStyle { $0.compositingGroup() }`
      not applied — documented as a one-liner addition if Wave 5 polish
      reveals jank on minimum-supported hardware. Combine
      `.removeDuplicates()` on `$dateRange` (ChartViewModel line 88)
      prevents redundant FFI calls when the same range is re-published.
      Cancellation-aware Task pattern (line 105, 143) means rapid range
      switching (7d → 30d → Custom in quick succession) only renders the
      latest result — no flicker from stale data landing late. ChartData
      is a value-type with `Equatable` synthesized, so SwiftUI's diff
      across `@Published` updates is O(samples) — for 840 samples this
      is sub-millisecond. **HOV-002 observation:** the hover annotation
      card (lines 142-149) is placed via `.overlay(alignment:
      .topTrailing)` which is geometrically simple but means the card
      doesn't follow the cursor — it floats in a fixed corner. Acceptable
      for Wave 4 but a Wave 5 polish opportunity if user feedback wants
      cursor-anchored tooltips.

  - name: security
    verdict: PASS
    notes: >-
      No new attack surface introduced. FFI calls (`ffiInitHistory`,
      `ffiQueryAggregated`) are pre-existing surface from Story 4.0.5;
      4.3 only adds Swift consumer-side code. Error handling never
      propagates a panic to the UI — `HistoryFfiError` is caught and
      mapped to a published `errorMessage` string. No new credentials,
      no network calls, no file I/O at the Swift layer. Vendor color
      mapping uses hardcoded `Color(red:green:blue:)` constants — no
      user-input rendering paths in the chart. `chartOverlay` +
      `onContinuousHover` event handling is sandboxed within the chart
      view's frame.

  - name: documentation
    verdict: PASS (exemplary)
    notes: >-
      This is the most thoroughly documented Wave 4 story so far.
      AggregatedSample.swift header (lines 1-25) explains the WHY of a
      Swift-side wrapper instead of binding to TimeBucket directly (3
      reasons listed). ChartViewModel.swift header (lines 1-37) walks
