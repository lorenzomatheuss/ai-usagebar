status_reason: >-
  Wave 4 chart foundation lands cleanly. The dev delivered the Swift Charts
  primary chart (stacked-area cost-by-vendor) + the reusable infrastructure
  (`AggregatedSample`, `ChartData`, `ChartViewModel`) that Stories 4.4-4.6
  will lean on, with thoughtful architectural rationale documented inline
  for every non-obvious choice. 9 of 10 ACs verified at code level + 2 of
  the 3 build gates green; AC-9 (XCTest for `fromFFI`) is the one explicit
  deferral and is well-justified — no XCTest target exists in
  apple/project.yml (testTargets: [] confirmed) per Wave 1 ADR §4, the
  Rust side already covers the aggregation logic via Story 4.0.5
  AC-7/8/9/10, the Swift `fromFFI` is a trivial bucket→sample map exercised
  by the 840-sample #Preview block, and standing up XCTest is itself a
  separate piece of work (better as a Wave 7 story). The implementation
  shows careful design beyond the AC checklist: (1) cancellation-aware
  `Task` in `reload(for:)` prevents stale FFI returns from clobbering
  newer range fetches during fast 7d→30d→Custom switching; (2) lazy
  idempotent `ffiInitHistory` survives a future architectural
  restructure where init might be lost mid-process; (3) deterministic
  alphabetical vendor sort in `ChartData.vendors` keeps the legend
  stable across reloads regardless of which vendor first appears in a
  given range; (4) `KeyValuePairs<String, Color>` (vs dictionary) for
  `vendorColorMapping` so Swift Charts gets deterministic legend
  ordering; (5) macOS 13 fallback for `ContentUnavailableView` (macOS
  14+) inline via `if #available`; (6) Reduce Motion guard on the chart
  cross-fade via `.animation(reduceMotion ? nil : ...)` (AC-7); (7)
  snap-to-sample hover annotation so the dashed RuleMark always aligns
  with a real bucket boundary instead of floating at interpolated
  x-positions; (8) a private `ChartContent` sub-view solves the
  `@StateObject A depends on @StateObject B at init time` deadlock
  cleanly without singletons or environment objects. CodeRabbit
  `--prompt-only -t committed --base main` returned **No findings** —
  the cleanest CR result of the Wave so far. Build gate matrix:
  `make build-core` ✓, `xcodegen generate` ✓, `xcodebuild Debug
  BUILD SUCCEEDED` ✓ (independently re-verified at gate time on
  branch HEAD), `cargo test --workspace` 242/242 passing (up from
  173 since previous Rust tests landed in 4.0.5; no regressions).
  Vendor string casing audit: `crates/torven-core/src/config.rs`
  uses lowercase identifiers (`openrouter`, `anthropic`, …) — matches
  the `vendorColorMapping` keys in `StackedAreaChart.swift`
  (lines 54-60) verbatim, so the color scale lookup will resolve at
  runtime. Score 9.5 vs 10 reflects (1) AC-9 deferral as DBT-002,
  (2) AC-8 performance verification is preview-eyeballed not
  instrumented (no fps counter), (3) one quiet ergonomics polish
  opportunity (HOV-001) for the hover annotation positioning when
  charts approach the top edge.

