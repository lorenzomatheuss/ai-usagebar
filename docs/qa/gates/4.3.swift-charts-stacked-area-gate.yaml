    String, costUsd Double, requestCount Int). Struct `ChartData` lines
    67-77 has `samples: [AggregatedSample]`, `vendors: [String]`,
    `var isEmpty: Bool { samples.isEmpty }`, plus static `.empty`
    factory. `AggregatedSample.fromFFI(_ buckets: [TimeBucket])
    -> ChartData` lines 93-115 maps `bucket.bucketStartTs` Int64-ms →
