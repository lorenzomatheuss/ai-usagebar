    severity: low
    category: code
    description: >-
      Hover annotation card is positioned via `.overlay(alignment:
      .topTrailing)` (StackedAreaChart.swift line 142) — it floats in
      a fixed corner of the chart frame rather than following the
      cursor. Acceptable for Wave 4 and consistent with the AC's
      "annotation showing date + vendor + cost" loose wording, but a
      richer per-mark anchor (annotation rendered near the hovered
      x-position) would be a UX upgrade.
    suggested_action: >-
      Defer to Wave 5 polish or capture as a Wave 7 follow-up. The
      anchor would use `proxy.position(forX:)` to compute the cursor's
      view-space x and render the annotation nearby (with edge clamping
      to avoid clipping). Not blocking.

