decisions_review:
  - decision: 'Private ChartContent sub-view for init-time ViewModel dependency'
    verdict: JUSTIFIED (canonical pattern)
    rationale: >-
      The top-level MainWindowView can't write `@StateObject(wrappedValue:
      ChartViewModel(mainViewModel: viewModel))` because its own
      `@StateObject viewModel` hasn't been published into `self` at init
      time — Swift's two-phase property initialization order forbids it.
      The dev's solution (private sub-view that takes the parent VM as
      `@ObservedObject` and constructs the child VM in its own init via
      `StateObject(wrappedValue:)`) is the documented macOS 13 idiom for
      this exact problem. Alternatives considered (singleton, environment
      object, weak reference passthrough) would all have introduced more
      indirection. The ChartContent sub-view also gives Stories 4.4+ a
      natural composition point — additional sibling charts (per-vendor
      grid, budget gauge) plug into this container rather than mutating
      MainWindowView.

  - decision: 'Combine `.sink` over `View.onChange` for $dateRange observation'
    verdict: JUSTIFIED (eliminates macOS 13/14 API risk)
    rationale: >-
      Story 4.3 Risk #3 flagged that View.onChange has different
      signatures pre/post macOS 14. The dev's choice of Combine `.sink`
      sidesteps the entire API gap — `Publisher<DateRange,Never>.sink`
      is unchanged on macOS 13.0 through current and delivers the
      current value to new subscribers (no separate "first load" kick
      needed). The `[weak self]` capture prevents the Combine retain
      cycle that's the typical foot-gun in this pattern. The
      `.removeDuplicates()` guard is cheap insurance against future
      refactors that might re-publish identical ranges.

  - decision: 'Lazy idempotent `ffiInitHistory` (not app-startup)'
    verdict: JUSTIFIED (correct deferral)
    rationale: >-
      Wave 4 doesn't yet have an AppDelegate hook for app-startup
      initialization (planned for Story 1.15 / ADR-10). The Rust impl
      of `ffi_init_history` writes `*slot = Some(db)` unconditionally
      so re-calling is safe (the dev verified this in
      `crates/torven-core/src/uniffi_exports.rs`). The `historyInitialized`
      flag prevents redundant work after the first successful call;
      the flag is reset on `HistoryFfiError` so a future recovery
      retry will re-init. This is the cleanest deferral pattern for
      "we know where this should live eventually but the right home
      doesn't exist yet."

  - decision: 'Task cancellation in `reload(for:)` for stale-result prevention'
    verdict: JUSTIFIED (correctness, not optimization)
    rationale: >-
      Without `inFlightTask?.cancel()` + `guard !Task.isCancelled`
      before `chartData = …`, a fast 7d → 30d → Custom range switch
      could result in the 7d query returning *after* the Custom query
      publishes its result, overwriting the user's actual selection
      with stale data. This isn't theoretical — the FFI call is
      synchronous from Swift's POV but the surrounding Task allows
      cooperative cancellation between the lazy init and the query.
      The pattern is exactly Apple's recommended "single latest result"
      idiom for async sources.

  - decision: 'KeyValuePairs (not Dictionary) for vendorColorMapping'
    verdict: JUSTIFIED (Swift Charts API contract)
    rationale: >-
      `chartForegroundStyleScale(_:)` consumes the pairs in declaration
      order for both the foreground style scale and the legend. A
      `[String: Color]` dictionary's iteration order is non-deterministic,
      so the legend would scramble across reloads. KeyValuePairs is
      ordered by declaration — the dev's choice matches the Swift
      Charts API expectation exactly.

  - decision: 'Hover snap-to-sample (RuleMark + annotation align to bucket)'
    verdict: JUSTIFIED (UX polish without cost)
    rationale: >-
      `chartProxy.value(atX:)` returns the *interpolated* date at the
      cursor's exact x-position, which would float the dashed guide
      line between bucket boundaries — visually noisy and incorrect
      for discrete-bucket data. Snapping to `min(by: timeIntervalSince(
      raw))` aligns the guide line and the annotation card with a real
      data point. O(samples) for 840 samples is a trivial cost.

  - decision: '`.chartPlotStyle { $0.compositingGroup() }` NOT applied'
    verdict: JUSTIFIED (avoid pre-optimization)
    rationale: >-
      The dev's T6 visual inspection showed 840 AreaMarks rendering
      cleanly on Apple Silicon. Applying `compositingGroup()`
      preemptively would (a) cost a render pass per redraw and
      (b) obscure whether the optimization is actually needed if
      jank ever appears. Documented as a one-line addition in
      design decision D-6 if Wave 5 polish reveals problems on
      minimum-supported hardware.

  - decision: '5-vendor brand-aligned color palette (KeyValuePairs ordered)'
    verdict: JUSTIFIED
    rationale: >-
      The chosen colors map to each vendor's marketing brand:
      OpenRouter purple, Anthropic orange, OpenAI dark green, Z.AI
      blue, Gemini grey (reserved — Wave 4 doesn't include Gemini
      data). RGB triples (not asset catalog) is consistent with the
      Wave 3 VendorCard color pattern. The legend will read in
      declaration order (openrouter, anthropic, openai, zai, gemini)
      which is alphabetical-ish and matches the `ChartData.vendors`
      sort order — so legend and chart agree on iteration order.

smoke_ux_recommendation:
  policy: 'Code-level PASS; runtime smoke = Lorenzo bench (NOT gate-blocking)'
  rationale: >-
    Wave 2/3/4 precedent (Story 3.2 AC-5 / Story 3.3 AC-9 / Story 4.1
    SMK-001 / Story 4.2 SMK-002) batches the runtime smoke verification
    with the closing story of each wave. For 4.3 the four smoke
    checkpoints to verify when Lorenzo opens the .app are:
      1. Open Main Window via ⌘1 — chart renders with placeholder
         removed (no more "History — Wave 4" text)
      2. With empty `history.db` (no snapshots): empty-state view
         shows ("No Data" icon + title + subtitle)
