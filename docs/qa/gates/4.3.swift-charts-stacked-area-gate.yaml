      the Combine-over-onChange decision (with the macOS 13/14 risk
      cross-reference), and the lazy-init contract for ffiInitHistory.
      StackedAreaChart.swift header (lines 1-42) documents the chart
      type choice (AreaMark vs BarMark/LineMark with ADR-6 reference),
      the Catmull-Rom interpolation rationale, the vendor color palette,
      and the macOS 13 compat caveats. Inline comments are dense but
      pertinent — e.g. line 88-90 explains why `removeDuplicates`, line
      105-106 explains task cancellation, line 218-222 explains
      snap-to-sample hover behavior. Dev Agent Record in the story
      file documents 7 design decisions (D-1 through D-7) and 3
