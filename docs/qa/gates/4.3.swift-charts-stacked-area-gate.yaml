      that the `fromFFI` Swift function isn't covered by an XCTest case;
      the function is a trivial map (line for line: bucket → sample) and
      Story 4.0.5's Rust tests cover the aggregation it consumes. The 840-
      sample #Preview block (StackedAreaChart.swift lines 299-330) exercises
