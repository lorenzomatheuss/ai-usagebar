status_reason: >-
  Wave 3 closure story executes the AccountPicker inline-sheet integration
  AND the supporting FFI extension (Q5=A) cleanly. Rust side adds
  `dictionary AccountInfo { id; label; is_active }` and
  `enum AccountFfiError { VendorNotFound, AccountNotFound, Storage }` to
  `torven_core.udl` plus the two free functions `get_accounts_for_vendor`
  and `[Throws=AccountFfiError] set_active_account`. Implementation in
  `uniffi_exports.rs` uses an `OnceLock<Mutex<HashMap<String, String>>>`
  for in-memory active state (TOML write-back deliberately deferred to
  Wave 4 per AC-1 implementation note) and exposes
  `get_accounts_for_vendor_inner` / `set_active_account_inner` as
  param-driven testable helpers — six new `#[test]` cases cover the
  happy path (2 OpenRouter accounts default-active first + swap), the
  Gemini empty-state (no error), unknown vendor (VendorNotFound),
  unknown account (AccountNotFound), and the `vendor_id_from_slug`
  mapping for all 4 known vendors + None for gemini/bogus. Swift side
  delivers `AccountPicker.swift` (90 LOC) with the AC-2 init signature,
  empty-state affordance, accentColor checkmark, and Reduce Motion via
  `@Environment(\.accessibilityReduceMotion)` driving `.transition`.
  `VendorCard.swift` gains `@State showPicker` + `@EnvironmentObject
  coreBridge` + `.contentShape(Rectangle())` + `.onTapGesture` +
  `.sheet(isPresented:)` while keeping the visual body (AC-3 / AC-10
  visual contract) intact. `CoreBridge.swift` extends with
  `@Published accountsByVendor` + lazy-cache `accounts(for:)` + graceful-
  error `swapActiveAccount(vendorId:accountId:)`. Generated bindings
  regenerated by `make build-core` (lines 829 / 1667 of
  `torven_core.swift` confirm `AccountInfo` struct and `AccountFfiError:
  Swift.Error` enum). All quality gates green: 225 tests pass (+6 new
  Rust tests), clippy/fmt clean, xcodebuild BUILD SUCCEEDED. Dual-
  checkpoint smoke confirmed by Lorenzo (sheet presents on tap + 60s
  multi-open without crash). Score 9.5 vs 10 reflects (1) AC-9 screenshot
  dispensation following the same pattern as Story 3.2 (audit trail via
  dual Lorenzo confirmation), and (2) AC-6 Reduce Motion implementation
  acknowledged as parcial per the dev note (content `.transition`
  respects the env but the system `.sheet()` container animation
  override is intrinsically limited in macOS 13 SwiftUI).

