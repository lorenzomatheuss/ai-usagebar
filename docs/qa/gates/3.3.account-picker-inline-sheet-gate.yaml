issues:
  - severity: low
    category: documentation
    description: >-
      AC-9 hard requirement ("Screenshot anexado no Change Log
      (sheet aberto sobre vendor card)") dispensed in favor of
      dual textual confirmation by Lorenzo (sheet renders +
      60s stability). Same dispensation pattern as Story 3.2
      AC-5 — audit trail preserved but not literal.
    recommendation: >-
      Accept following Wave 2 / Story 3.2 precedent. For Wave
      4 stories with UI affordances reaching FR completion,
      consider including either a screenshot-or-textual-
      equivalent fallback wording or an explicit "no-
      screenshot-needed" exemption for chained dev sessions
      where the user (Lorenzo) is co-present during smoke.
  - severity: low
    category: performance
    description: >-
      Reduce Motion implementation respects the env on the
      sheet *content* via `.transition`/`.animation`, but the
      native `.sheet()` container animation cannot be fully
      overridden in macOS 13 SwiftUI. The system already
      reduces animation duration when Reduce Motion is on, so
      user impact is bounded — but a full opacity-fade is not
      achievable without a custom presentation controller.
    recommendation: >-
      Accept as documented pragma. If Wave 4 bumps the macOS
      deployment target to 14+, revisit with
      `.presentationDetents([.medium])` + custom transition.
  - severity: low
    category: code
    description: >-
      `set_active_account` active map is in-memory only —
      restart loses the swap. This is the deliberate Wave 3
      scope per the Dev Notes ("write-back TOML adiado para
      Wave 4"), but warrants a tracked follow-up so it
      doesn't drift.
    recommendation: >-
      File a Wave 4 task to persist the active map to
      `config.toml` via toml_edit (same crate the Settings
      overlay uses). Mitigate the race with Settings overlay
      by ensuring single-threaded Rust writes are gated by
      the same global lock.

recommendations:
  - >-
    Wave 3 FR-6 (multi-account) is now functionally complete
    end-to-end (FFI surface + UI shape + swap behavior) with
    only the persistence layer deferred. Recommend listing
    the three follow-ups (persistence, sheet container
    Reduce Motion in macOS 14+, keychain credential
    validation inline feedback) as Wave 4 bullet items in
    the next epic-execution YAML.
  - >-
    Story 3.4 (refactor VendorViewModel) confirmed not
    needed — CoreBridge sits at ~90 LOC with 2 coherent
    responsibilities (vendors + accounts cache+swap), well
    below the 200-LOC/3-responsibility threshold from the
    Story 3.3 Dev Notes.

