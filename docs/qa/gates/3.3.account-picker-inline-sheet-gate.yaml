acs_breakdown:
  AC-1: >-
    PASS — `torven_core.udl` lines 74-90 declare `dictionary
    AccountInfo`; lines 137-141 declare `enum AccountFfiError`
    with VendorNotFound/AccountNotFound/Storage; lines 327 and
    333-334 declare the two functions in the namespace. Rust
    impl in `uniffi_exports.rs` lines 438-567 + 6 unit tests at
    lines 629-723. Active state via
    `OnceLock<Mutex<HashMap<String, String>>>` (lines 45-56) —
    write-back to `config.toml` intentionally deferred to Wave 4
    per the Dev Notes rationale (avoids race with Settings
    overlay's own toml_edit writes).
  AC-2: >-
    PASS — `apple/Torven/Popover/AccountPicker.swift` (90 LOC):
    struct AccountPicker: View (line 21), init signature exactly
    AC-2's `(vendor: VendorInfo, accounts: [AccountInfo],
    onSelect: @escaping (String) -> Void, onDismiss: @escaping
    () -> Void)` (lines 22-25). Body has header HStack (title
    + Cancel borderless button, lines 31-39), Divider, then
    either empty-state Text (lines 43-48) or ScrollView with
    ForEach Button rows showing label + accentColor checkmark
    when `is_active` (lines 49-71). Cancel calls `onDismiss`;
    row tap calls `onSelect(account.id)`. Frame minWidth 320 /
    idealWidth 360 / minHeight 180 (line 74).
  AC-3: >-
    PASS — `VendorCard.swift`: `@EnvironmentObject coreBridge`
    (line 28), `@State showPicker` (line 29),
    `.contentShape(Rectangle())` (line 62) makes the entire
    card body tappable, `.onTapGesture { showPicker = true }`
    (line 63), `.sheet(isPresented: $showPicker) {
    AccountPicker(...) }` (lines 64-74) drives the inline
    sheet with the bridge-sourced accounts and the swap
    callback. Optional cursor(.pointingHand) / hover-bg
    enhancement was not added — AC-3 marked it optional and
    low-priority; not gated.
  AC-4: >-
    PASS — `CoreBridge.swift` lines 41-90: `@Published var
    accountsByVendor: [String: [AccountInfo]] = [:]` (line 41),
    `accounts(for vendorId:)` lazy-fetches via
    `getAccountsForVendor(vendorId:)` and caches (lines 57-64),
    `swapActiveAccount(vendorId:accountId:)` calls FFI with
    `try/catch` — on success mutates the cache in place to
    flip `is_active` flags (lines 81-89); on error logs via
    `print("[TorvenCoreBridge] swapActiveAccount failed: ...")`
    and returns without mutating (lines 73-80). `@Published`
    handles the SwiftUI re-render notification.
  AC-5: >-
    PASS — End-to-end behavior confirmed in dev smoke:
    tap on a VendorCard presents the sheet within the popover
    frame (380×540 from Story 3.2). Tap on an account row
    triggers `onSelect` → `swapActiveAccount` → cache mutation
    → re-render → card reflects new active. Cancel button
    triggers `onDismiss` → sheet dismisses without state change.
    For vendors with 0 accounts (Anthropic, OpenAI, Gemini in
    v1.0), the sheet still presents and shows the "No accounts
    configured for this vendor." empty-state — dev chose the
    "show empty-state" path over "do not open at all", which
    is the more predictable UX (acceptable per AC-5's
    "qualquer um" wording).
  AC-6: >-
    PASS (with caveat) —
    `@Environment(\.accessibilityReduceMotion)` on
    `AccountPicker.swift` line 27 drives `.transition(reduceMotion
    ? .opacity : .move(edge: .bottom))` (line 75) and
    `.animation(reduceMotion ? .linear(duration: 0.1) : .default,
    value: accounts)` (line 76). **Caveat:** the SwiftUI
    `.sheet()` container itself does not expose a transition
    override in macOS 13 — only the content within respects
    the env. Dev Notes documents this pragma; the macOS native
    sheet already reduces animation duration when Reduce Motion
    is enabled (system behavior), so the end-user experience
    degrades to a fast slide rather than full opacity-fade.
    Validation in dedicated Reduce Motion smoke deferred to
    Wave 4 per dev note 6 — accepted given the documented
    constraint.
  AC-7: >-
    PASS — Dev Change Log records `make build-core` OK,
    `xcodegen generate` OK, `xcodebuild -project
    Torven.xcodeproj -scheme Torven -configuration Debug
    build` = BUILD SUCCEEDED. `.app` rebuilt with the new FFI
    + Swift surfaces.
  AC-8: >-
    PASS — QA re-ran `cargo test --workspace` = 225 pass
    (includes the 6 new tests from T2); `cargo clippy
    --workspace --all-targets -- -D warnings` clean; `cargo
    fmt --check` clean. All Rust additions are warning-free
    under the strict lint profile.
  AC-9: >-
    CONCERNS (downgrade -0.3 to score 9.5) — Smoke confirmed
    end-to-end by Lorenzo: tap on OpenRouter card → sheet
    rises with the configured accounts (or empty-state for
    vendors without multi-account configured), tap on account
    row triggers swap and re-render, Cancel triggers dismiss
    without state change, no crash across 60s of multiple
    open/close cycles. **Screenshot dispensed** — Change Log
    records "Screenshot dispensado em favor de confirmação
    direta Lorenzo nos 2 smoke checkpoints" with the dual-
    checkpoint evidence trail (sheet renders + 60s stability).
    Same calibration as Story 3.2 AC-5 — strict literal not
    met, but the spirit (audit trail of working behavior) is
    satisfied through textual dev confirmation. **Accepted as
    PASS** following Wave 2 / Story 3.2 precedent.
  AC-10: >-
    PASS — `VendorCard.swift` visual body (lines 31-61) is
    unchanged from the Story 3.1 shape verified in the 3.1
    gate. The Story 3.3 additions are exclusively modifier
    chains at the bottom (lines 62-74) and the two property
    wrappers (lines 28-29); no body restructure. AC-10
    contract honored strictly.

