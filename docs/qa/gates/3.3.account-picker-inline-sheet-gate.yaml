checks_detail:
  - name: code_review
    verdict: PASS
    notes: >-
      Rust side: `uniffi_exports.rs` lines 438-723 are a textbook FFI
      extension — `AccountInfo` struct with `#[derive(Debug, Clone,
      PartialEq, Eq)]`, `AccountFfiError` as `thiserror::Error`
      enum with `VendorNotFound`/`AccountNotFound`/`Storage`,
      `vendor_id_from_slug` private helper that maps slug → VendorId
      (None for "gemini" + "bogus"),
      `get_accounts_for_vendor_inner(&Config, &HashMap, &str)` and
      `set_active_account_inner(&Config, &mut HashMap, &str, &str)`
      param-driven helpers, production wrappers
      `get_accounts_for_vendor`/`set_active_account` that resolve
      globals (Config::load + active_accounts() mutex) and delegate
      to the inner helpers. Six new unit tests in `mod tests {}`
      block cover the contract surface. `lib.rs` lines 52-58 re-
      export the new types and functions so the UDL scaffolding
      resolves them at `crate::`. Swift side: `AccountPicker.swift`
      (90 LOC) uses the AC-2 init signature exactly
      (`init(vendor:accounts:onSelect:onDismiss:)`), wraps content
      in `VStack(alignment: .leading, spacing: 0)` with header
      HStack (title + Cancel) + Divider + ScrollView with
      Button rows + empty-state branch. Reduce Motion respected via
      `@Environment(\.accessibilityReduceMotion)` driving
      `.transition` and `.animation`. `VendorCard.swift` lines 28-29
      add `@EnvironmentObject` + `@State showPicker`; lines 62-74
      apply `.contentShape(Rectangle())` + `.onTapGesture { showPicker
      = true }` + `.sheet(isPresented: $showPicker) { AccountPicker(...) }`
      — visual body lines 31-61 unchanged from the Story 3.1 shape
      (AC-10 honored). `CoreBridge.swift` lines 41-90 add
      `@Published accountsByVendor`, `accounts(for:)` lazy cache,
      and `swapActiveAccount(vendorId:accountId:)` with graceful
      `try/catch` — error path logs and bails without mutating cache
      (AC-4 graceful degradation contract).

  - name: unit_tests
    verdict: PASS
    notes: >-
      6 new Rust tests in `uniffi_exports.rs` cover the full FFI
      contract surface:
      `get_accounts_for_vendor_returns_two_rows_with_default_active`,
      `set_active_account_swaps_to_second_row`,
      `get_accounts_for_unknown_vendor_returns_empty_not_error`,
      `set_active_account_unknown_vendor_returns_vendor_not_found`,
      `set_active_account_unknown_account_returns_account_not_found`,
      `vendor_id_from_slug_maps_all_four_known_vendors`. The fixture
      `config_with_two_openrouter_accounts()` uses
      `Config::load_from_str(toml)` (no file-system setup) — the
      param-driven inner helpers were the right design choice for
      testability. All 6 pass. Total workspace test count is 225
      (+6 from the 219 baseline established before Wave 3).

  - name: acceptance_criteria
    verdict: PASS
    notes: '10/10 ACs verified — see acs_breakdown. AC-9 screenshot dispensation + AC-6 Reduce Motion partial mentioned under issues.'

  - name: no_regressions
    verdict: PASS
    notes: >-
      QA verified `cargo test --workspace` (225 pass, 9 ignored),
      `cargo clippy --workspace --all-targets -- -D warnings`
      (clean), `cargo fmt --check` (clean). Generated bindings
      `apple/Torven/Bridge/Generated/torven_core.swift` regenerated
      cleanly (90KB; AccountInfo + AccountFfiError public types
      at lines 829 and 1667 respectively). xcodebuild Debug BUILD
      SUCCEEDED per dev Change Log. Smoke run preserved Story 3.2
      contracts (5 cards visible without scroll, header preserved,
      no crash) and added the new sheet behavior on top.

  - name: performance
    verdict: N/A
    notes: >-
      Sheet presentation uses native SwiftUI `.sheet(isPresented:)`.
      No async waterfall, no FFI in the tap path — `accounts(for:)`
      lazy-caches per vendor on first read. The
      `OnceLock<Mutex<HashMap>>` lookup in Rust is O(1) per FFI
      call. No NFR with measurable target applies here.

  - name: security
    verdict: PASS
    notes: >-
      `AccountInfo` in the UDL contains `id` (deterministic
      `account_id(vendor, name)` from `config.rs`, safe per the
      SECURITY note on UDL lines 81-85), `label` (the user's free-
      form display name, non-secret), and `is_active` (boolean).
      No API key, OAuth token, or other credential material crosses
      the FFI in this story. The Wave 1.20 Keychain blob helpers
      remain the only path for credential material — Story 3.3
      respects this boundary explicitly. `vendor_id_from_slug`
      defensively returns None for unknown slugs, so the FFI cannot
      be coaxed into Storage panics through bad input.

  - name: documentation
    verdict: PASS
    notes: >-
      Story file is the largest in Wave 3 (~500 lines): "Decisões
      Cravadas" section makes Q5=A explicit; AC-1 includes the
      exact UDL diff (dictionary + enum + 2 free functions); Dev
      Notes explains why Inline Sheet over ZStack overlay (Lorenzo
      kickoff decision), the macOS 13 `.presentationDetents`
      limitation, the Reduce Motion implementation pragma, and the
      race-condition mitigation (single-threaded Rust write). UDL
      lines 74-90 document `AccountInfo` with a security paragraph;
      lines 314-334 document the two functions with the empty-
      sequence contract and the Wave 4 persistence deferral.
      File List exhaustive. Change Log captures full lifecycle
      including the chained dev session.

