status_reason: >-
  Wave 5 Story 5.2 lands the native macOS Settings UI for vendor API-key
  management cleanly. All 9 ACs implemented exactly per WAVE5-D7-adjusted
  spec: 2 OAuth-status read-only sections (Anthropic, OpenAI) using only
  `FileManager.fileExists` on `~/.claude/.credentials.json` / `~/.codex/
  auth.json` (CLAUDE.md secret discipline honored — never reads file
  content), and 2 SecureField API-key sections (OpenRouter, Z.AI) persisted
  via `ffi_keychain_set_blob`. The Swift `KeychainBlob` struct mirrors
  Rust's `AccountsBlob { version, accounts[AccountSecret { account_id,
  api_key }] }` verbatim with explicit `CodingKeys` to bridge Swift camelCase
  to Rust serde snake_case — wire format compatibility verified against
  `crates/torven-core/src/keychain/mod.rs`. `account_id = "{vendor}-default"`
  pattern matches `config.rs::account_id(vendor, "default")` exactly. The
  three-file split (SettingsView / SettingsViewModel / VendorKeyRow) is
  clean and idiomatic SwiftUI; ViewModel uses `@MainActor` + injection seams
  (`fileExists`, `homeDirectoryProvider`) for future testability. Security
  invariants fully respected — zero `print()`/`debugPrint`/`os_log`/`NSLog`
  in `Settings/`, plaintext key lives only in `@Published` for ViewModel
  lifetime, error messages surfaced without api_key (controlled by Rust
  side per gate of Story 1.20). `xcodebuild clean build` BUILD SUCCEEDED;
  zero new Swift warnings. Two minor non-blocking observations documented
  (redundant autocorrect modifiers, no XCTest unit tests despite testability
  seams) — neither warrants a CONCERNS verdict given the SwiftUI scope and
  deliberate trade-offs documented in the story.

