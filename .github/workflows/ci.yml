name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  rust-quality:
    name: Rust Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo machete
        run: cargo machete

  xcode-scaffold:
    name: Xcode Scaffold
    runs-on: macos-14
    continue-on-error: true  # TODO: remover em Story 1.27 quando signing OK
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build Rust core (aarch64 — Apple Silicon runner)
        run: cargo build --release --target aarch64-apple-darwin -p torven-core

      - name: Build xcframework (stub se script não implementado ainda)
        run: |
          if [ -f apple/scripts/build-xcframework.sh ]; then
            ./apple/scripts/build-xcframework.sh
          else
            echo "build-xcframework.sh not yet implemented — skip"
          fi

      - name: Generate Xcode project
        run: |
          cd apple
          xcodegen generate
          # XcodeGen 2.45 can emit objectVersion 77, which requires newer
          # Xcode than the macos-14/Xcode 15.4 runner. Keep CI on the Xcode 15
          # project format until the runner image moves forward.
          perl -0pi -e 's/objectVersion = 77;/objectVersion = 60;/' Torven.xcodeproj/project.pbxproj

      - name: Build app (no signing)
        run: |
          cd apple
          xcodebuild \
            -project Torven.xcodeproj \
            -scheme Torven \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Story 5.5.3 (Wave 5.5) — XCTest gate. AC-11/AC-12/AC-13.
      # `continue-on-error: true` keeps this advisory while we stabilise the
      # CI signal — promoted to blocking after ≥ 1 week of consistent green
      # runs (AC-12 escalation criterion).
      - name: Run XCTest target
        continue-on-error: true
        run: |
          cd apple
          xcodebuild test \
            -project Torven.xcodeproj \
            -scheme Torven \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/test-results.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # AC-13: upload the .xcresult bundle on failure so contributors can
      # download it and inspect failing tests in Xcode locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xctest-results
          path: apple/build/test-results.xcresult
