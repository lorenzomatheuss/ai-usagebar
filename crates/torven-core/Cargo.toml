[package]
name = "torven-core"
version = "0.5.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "torven_core"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib", "cdylib"]

[[bin]]
name = "torven-evals"
path = "src/bin/torven-evals.rs"

# UniFFI bindings generator — invoked as `cargo run --bin uniffi-bindgen ...`
# to keep the bindgen tool version-locked to the `uniffi` runtime dependency.
# Required by the `uniffi-cli` feature, which is only enabled for this binary
# so we don't pay the clap + askama compile cost in the library build.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
# Pulls in the `clap`/`askama` CLI dependencies inside `uniffi`. Enabled only
# when building the `uniffi-bindgen` binary above. Library and `torven-evals`
# builds skip this to keep the dependency surface lean.
uniffi-cli = ["uniffi/cli"]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "process", "signal"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Story 1.6 — round-trip TOML config save preserving user comments / decor.
# Previously lived only in `torven-tui` (settings overlay); the Vec<Account>
# config schema now needs the same comment-preserving round-trip in core.
toml_edit = "0.22"
# Story 1.6 — structured warnings for legacy → multi-account config migration.
# Only the macros are pulled in here; the consuming binary (TUI or macOS app)
# is responsible for wiring up a subscriber.
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
tempfile = "3"
directories = "5"
dirs = "5"
thiserror = "2"
base64 = "0.22"
# UniFFI runtime — exposes Rust functions to Swift via FFI scaffolding (Story 1.2).
# `tokio` feature is required for `[Async]` annotations in the UDL (used in
# Story 1.15 for AI Insights streaming).
#
# Version pin: 0.29 (not 0.27 as originally specced in Story 1.2). The AR-1
# spike found that UniFFI 0.27.x emits `#[no_mangle]` in its generated
# scaffolding without the `unsafe(no_mangle)` wrapper that Rust edition 2024
# requires. 0.29 ships the fix. See Story 1.2 Change Log for the spike output.
# See ADR-4 for the binding-tool decision rationale.
uniffi = { version = "0.29", features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "2.10", features = ["OSX_10_13"] }

[build-dependencies]
# UniFFI build-time scaffolding generator — reads `src/torven_core.udl` from
# `build.rs` and emits the Rust glue code that the runtime crate uses to expose
# functions through the FFI surface. Version pinned to match the runtime
# `uniffi` dependency.
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
mockito = "1"
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
tempfile = "3"

# Bootstrap stubs declared in Story 1.1 — Wave 1 stories trim this list as
# they consume each dep. Story 1.4 (extract-core) consumed tokio, reqwest,
# serde, serde_json, chrono, fs2, tempfile, directories, thiserror, toml,
# base64, and clap by migrating the vendor fetchers + config loader into this
# crate. `toml_edit` was removed from this crate entirely (it only had a TUI
# consumer in `settings.rs`, which now lives in `torven-tui`).
#
# Nothing remains here — all the stubs ended up genuinely consumed. Keep the
# `[package.metadata.cargo-machete]` section so future Wave 1 stories
# (1.13/1.15/1.20) can re-introduce stub deps with the same explanation
# pattern; an empty `ignored` list is intentional.
[package.metadata.cargo-machete]
ignored = []
