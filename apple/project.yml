name: Torven
options:
  bundleIdPrefix: com.torven
  xcodeVersion: "15.4"
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM is interpolated at xcodegen time from the env. Local
    # debug builds can leave it empty (CODE_SIGN_STYLE=Automatic without a
    # team yields ad-hoc signing for the simulator/dev session). Release
    # builds (Story 1.21 notarization) MUST set it to the Apple Developer
    # team ID.
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: Automatic
packages:
  # Story 4.1 (Wave 4): global hotkey ⌘1 to open the Main Window. Decision
  # WAVE4-D5 (cravada) — sindresorhus/KeyboardShortcuts over Carbon/NSEvent
  # custom (avoids ~200 LOC of boilerplate). Compatible with macOS 13+ target.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Torven:
    type: application
    platform: macOS
    sources:
      - path: Torven
    # Link TorvenCore.xcframework (built by apple/scripts/build-xcframework.sh
    # in Story 1.5). The xcframework wraps a Rust staticlib + the C header
    # + a clang modulemap generated by uniffi-bindgen from torven_core.udl.
    # `embed: false` because static libraries are linked at build time, not
    # bundled at runtime.
    dependencies:
      - framework: Frameworks/TorvenCore.xcframework
        embed: false
      - package: KeyboardShortcuts
    info:
      path: Torven/Info.plist
      properties:
        # Story 5.2.1 iteration 4 (WAVE5-D8-impl-v4 FINAL): `LSUIElement: true`
        # preservado. Iter 3 (Pragmática 1) tentou removê-lo, mas smoke do
        # Lorenzo mostrou app ainda encerrando ao fechar Settings mesmo com
        # `applicationShouldTerminateAfterLastWindowClosed { false }` — quirk
        # do `MenuBarExtra` + `Settings { }` SwiftUI scene em macOS 13+ que
        # AppDelegate adapter não consegue segurar. Pragmática 2 (FINAL):
        # bypassa a `Settings { }` scene SwiftUI inteiramente — Settings UI
        # agora é wrapped via `NSHostingView` dentro de um `NSWindow`
        # programático (ver `SettingsWindowController.swift`, mesmo pattern
        # de `MainWindowController.swift`/Story 4.1, já em produção). Sem
        # XPC/ViewBridge envolvido — `NSWindow` programático não passa por
        # XPC, portanto `.accessory` activation policy do `LSUIElement: true`
        # não causa cancelamento. App segue menu-bar-only sem dock icon.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
    scheme:
      # Story 5.5.3 (Wave 5.5): wire the new TorvenTests bundle into the
      # shared `Torven` scheme's Test action. `gatherCoverageData: true`
      # enables `xcrun xccov view --report` so AC-15 coverage thresholds
      # (informational, non-blocking) can be measured locally.
      testTargets:
        - TorvenTests
      gatherCoverageData: true
      coverageTargets:
        - Torven
      commandLineArguments: {}
      environmentVariables: {}
  # Story 5.5.3 (Wave 5.5): XCTest unit-test bundle hosted by Torven.app.
  # - WAVE5.5-D10: bundle id `com.torven.Torven.Tests`, target name
  #   `TorvenTests`. xcodegen derives the bundle id from `bundleIdPrefix`
  #   + target name, so the resulting id is `com.torven.TorvenTests` by
  #   default — override via PRODUCT_BUNDLE_IDENTIFIER to honour the
  #   cravada `com.torven.Torven.Tests`.
  # - WAVE5.5-D12: mock strategy = DI; no Mockingbird/Cuckoo. Tests reach
  #   internal types via `@testable import Torven`, which requires the
  #   main app to be built with `ENABLE_TESTABILITY = YES` (it is in
  #   Debug — see Torven target Debug config inherited from xcodegen
  #   defaults).
  # - Test host = `$(BUILT_PRODUCTS_DIR)/Torven.app/Contents/MacOS/Torven`
  #   (in-app testing). xcodegen sets this automatically when `dependencies`
  #   references the main target with `link: false`.
  TorvenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TorvenTests
    dependencies:
      - target: Torven
    settings:
      base:
        # WAVE5.5-D10 cravada: bundle id explicit to honour the cravada
        # `com.torven.Torven.Tests` (xcodegen default would be
        # `com.torven.TorvenTests`).
        PRODUCT_BUNDLE_IDENTIFIER: com.torven.Torven.Tests
        # Test target deployment target matches the main app (macOS 13+).
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # @testable import requires Debug configurations to build the app
        # with testability — Xcode default for Debug.
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Torven.app/Contents/MacOS/Torven"
        # In-app tests inherit the app's frameworks search path so they
        # can find TorvenCore.xcframework symbols at test time.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        # Resource files (fixture JSONs) live alongside the test sources.
        # xcodegen builds them into the test bundle's Resources/ folder so
        # `Bundle(for:).url(forResource:withExtension:)` finds them at
        # runtime.
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ALWAYS_SEARCH_USER_PATHS: NO
